inspirations:
  - title: "Haridasa Thakura, the Namacarya"
    text: "Haridasa Thakura chanted three hundred thousand Holy Names daily in a cave at Phulia. When persecuted, he received twenty-two lashes across as many marketplaces — and the Name itself protected him. He is called the Namacarya, the teacher of the Holy Name."
    source: "Caitanya Bhagavata; CC Antya 3"

  - title: "Ajamila's Last Word"
    text: "Ajamila, dying in fear and surrounded by Yamaraja's messengers, called for his youngest son — whose name was Narayana. Even this inadvertent utterance of the Lord's Name summoned the Vishnudutas, who carried his soul to Vaikuntha. The Name has its own power, even when not consciously addressed."
    source: "Srimad Bhagavatam 6.1–3"

  - title: "Mrgari the Hunter"
    text: "Mrgari, a hunter who half-killed animals for sport, met Narada Muni and was struck by his gentleness. Through hearing and chanting alone, he abandoned violence — even refusing to sit on grass lest he crush insects. The Name transformed the hunter into a sage."
    source: "Caitanya Bhagavata Adi 2"

  - title: "Sanatana Goswami's Govardhana Parikrama"
    text: "Sanatana Gosvami, near seventy years old, walked the four-mile Govardhana parikrama daily on bleeding feet. Sri Caitanya Mahaprabhu finally appeared to him and asked that he stop — the body of a devotee is also worthy of care. The example of effort and the example of moderation came together in one teaching."
    source: "Caitanya Caritamrta Antya 4"

  - title: "Mahaprabhu at the Gambhira"
    text: "In His last twelve years at Jagannatha Puri, Sri Caitanya Mahaprabhu spent His nights at the Gambhira chamber, weeping and chanting 'Where is Krishna? Where is Krishna?' His madness for the Holy Name showed what bhava-bhakti looks like at the highest level."
    source: "Caitanya Caritamrta Antya 11–14"

  - title: "Bhaktivinoda's Lamp"
    text: "Bhaktivinoda Thakura, a magistrate by day, wrote Hari-nama-cintamani and many other treatises by lamplight at night. Through worldly burdens, the Name made him fearless. He is the one who recovered the birthplace of Sri Caitanya Mahaprabhu at Mayapur."
    source: "Sri Bhaktivinoda Vani-vaibhava; Bhaktivinoda biographies"

  - title: "Putana's Liberation"
    text: "Putana, sent by Kamsa to kill baby Krishna with poison on her breast, was instead given the elevated position reserved for nursing mothers — because she had offered her breast, even with murderous intent. The Lord saw only her form of giving."
    source: "Srimad Bhagavatam 10.6"

  - title: "The Six Goswamis of Vrindavan"
    text: "Rupa, Sanatana, Raghunatha Bhatta, Gopala Bhatta, Jiva, and Raghunatha Dasa — the six Goswamis — slept three hours, ate one chapati, walked from temple to temple, and chanted day and night. From their lives the entire literature of Gaudiya Vaishnavism flowed."
    source: "Sri Sri Sad-Gosvamy-astaka by Srinivasa Acarya"

  - title: "Narottama's 'Hari Hari, Bifale'"
    text: "Narottama Dasa Thakura sang: 'Hari Hari, bifale janama gonainu' — Hari, Hari, I have wasted my birth without bhakti. His lament became a song that has guided generations back to the practice."
    source: "Prarthana by Narottama Dasa Thakura"

  - title: "Nalakuvara and Manigriva"
    text: "Two sons of Kuvera, cursed by Narada to become trees in Nanda Maharaja's courtyard, were freed when baby Krishna, dragging a mortar between them, uprooted both. Even those bound by the consequence of pride found liberation through the Lord's lila."
    source: "Srimad Bhagavatam 10.10"

  - title: "Dhruva at Five"
    text: "Dhruva, only five years old, was rebuked by his stepmother and went to the forest seeking the Lord. After six months of one-pointed practice — eating less and less, breathing more deeply, meditating on the form Narada had taught him — Krishna appeared before him."
    source: "Srimad Bhagavatam 4.8–9"

  - title: "Prahlada's Steadiness"
    text: "Prahlada, five-year-old son of the demon Hiranyakashipu, never stopped chanting Krishna's Name even when his father had him thrown from a cliff, fed to elephants, and given poison. The Name protected him; his father could not silence him."
    source: "Srimad Bhagavatam 7.5"

  - title: "Rupa Gosvami Under the Trees"
    text: "Rupa Gosvami, formerly the chief minister, spent his entire fortune feeding devotees, then lived under trees in Vrindavan, writing Bhakti-rasamrta-sindhu — the ocean of devotional rasa. From simplicity, the science of bhakti emerged."
    source: "Bhakti-ratnakara"

  - title: "Ramanuja's Gopuram Announcement"
    text: "Ramanujacarya, given the most sacred mantra by his teacher with instructions to share it with no one, climbed the temple gopuram and called the mantra out to all who would hear. Asked why he disobeyed, he replied: 'If my disobedience saves them, I gladly take the consequences.'"
    source: "Ramanuja Divya-vaibhava"

  - title: "Madhavendra Puri at Govinda's Door"
    text: "Madhavendra Puri, hungering after intense bhakti and refusing to beg for food, was found by Krishna Himself disguised as a young cowherd boy who brought him milk. The Lord serves those who serve only Him."
    source: "Caitanya Caritamrta Madhya 4"

  - title: "Lord Caitanya's Pancha-Tattva"
    text: "Sri Caitanya Mahaprabhu Himself chanted the Holy Name with Lord Nityananda, Sri Advaita, Gadadhara Pandita, and Srivasa Thakura — the five who together form the source of the sankirtana movement. Their kirtana set the standard for all who followed."
    source: "Caitanya Bhagavata; Caitanya Caritamrta Adi 7"

  - title: "Bhaktisiddhanta's 64 Rounds"
    text: "Bhaktisiddhanta Sarasvati Thakura, the spiritual master of Srila Prabhupada, took the vow of chanting sixty-four rounds daily — four times the standing minimum. His example anchored modern Gaudiya practice in personal sadhana."
    source: "Sri Bhaktisiddhanta-vaibhava"

  - title: "Srila Prabhupada at Tompkins Square Park"
    text: "At the age of seventy, alone with forty rupees and a trunk of books, Srila Prabhupada chanted under a tree in Tompkins Square Park, New York City, in 1966. From that tree, ISKCON began. He proved nothing is too late to begin."
    source: "Srila Prabhupada-lilamrta by Satsvarupa Dasa Goswami"
