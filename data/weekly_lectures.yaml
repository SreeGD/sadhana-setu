# Weekly-lecture library — Sadhana Setu v1.7
#
# One recommended audio lecture a week from ISKCON Desire Tree's audio
# archive (audio.iskcondesiretree.com). Where a specific MP3 URL is
# pinned, the static app embeds an HTML5 audio player. Where only a
# folder is known, the app shows a "Browse archive" button so the user
# can pick a specific lecture themselves.
#
# Each entry: title · speaker · mp3_url (nullable) · folder_url ·
# series · duration · why_it_helps_chanting · source.
#
# STATUS: DRAFT — 6 entries with direct embeddable MP3 URLs
# (2 Srila Prabhupada japa recordings + 4 Bhurijana Prabhu japa /
# Sikshastaka / chanting lectures, verified from the archive's
# directory listing). 4 entries point at speaker folders pending
# SreeGD's specific selection.

status: draft
review_notes: |
  Reviewer: SreeGD (Sreenivas Gopal Dasa)
  Seeded: 2026-06-10
  Notes: 10 entries total. Direct MP3 URLs verified for:
    1. Srila Prabhupada — Group Japa (audio of His Divine Grace chanting)
    2. Srila Prabhupada — Japa by Example
    3-6. HG Bhurijana Prabhu — 4 japa-mood lectures
  The remaining entries (Radhanatha Swami, Sacinandana Swami, Mahatma
  Prabhu, Bhakti Charu Swami) carry folder_url pointing at each
  speaker's archive page; pin specific URLs after listening.

weekly_lectures:
  - title: "Group Japa"
    speaker: "Śrīla Prabhupāda"
    mp3_url: "https://audio.iskcondesiretree.com/01_-_Srila_Prabhupada/03_-_Japa/SP_01_Group_Japa.mp3"
    folder_url: "https://audio.iskcondesiretree.com/index.php?q=f&f=%2F01_-_Srila_Prabhupada%2F03_-_Japa"
    series: "Śrīla Prabhupāda's Japa recordings"
    duration: "~12 min"
    why_it_helps_chanting: |
      Listen to His Divine Grace Śrīla Prabhupāda himself chanting japa
      in a group with disciples. This is not a lecture *about* chanting
      — it is the sound of the founder-ācārya chanting. Play it once
      before your morning rounds and let the cadence, pronunciation,
      and mood inform your own. Nothing instructs japa more than this.
    source: "ISKCON Desire Tree Audio Archive — Śrīla Prabhupāda Japa folder"

  - title: "Japa by Example"
    speaker: "Śrīla Prabhupāda"
    mp3_url: "https://audio.iskcondesiretree.com/01_-_Srila_Prabhupada/03_-_Japa/SP_02_Japa_by_Example.mp3"
    folder_url: "https://audio.iskcondesiretree.com/index.php?q=f&f=%2F01_-_Srila_Prabhupada%2F03_-_Japa"
    series: "Śrīla Prabhupāda's Japa recordings"
    duration: "~10 min"
    why_it_helps_chanting: |
      The second of Śrīla Prabhupāda's two preserved japa recordings —
      a model of attentive chanting at brāhma-muhūrta pace. Use this
      not as background music but as a pre-japa tuning fork: listen
      once, then begin your own rounds at the same pace, with the same
      precision of each syllable.
    source: "ISKCON Desire Tree Audio Archive — Śrīla Prabhupāda Japa folder"

  - title: "Japa Class — Vṛndāvana 2011-01-07"
    speaker: "HG Bhurijana Prabhu"
    mp3_url: "https://audio.iskcondesiretree.com/03_-_ISKCON_Prabhujis/ISKCON_Prabhujis_-_A_to_J/His_Grace_Bhurijana_Prabhu/Various/BJP_Various_-_Japa_Class_-_2011-01-07_ISKCON_Vrindavan.mp3"
    folder_url: "https://audio.iskcondesiretree.com/index.php?q=f&f=%2F03_-_ISKCON_Prabhujis%2FISKCON_Prabhujis_-_A_to_J%2FHis_Grace_Bhurijana_Prabhu%2FVarious"
    series: "Vṛndāvana Japa Workshops"
    duration: "~60 min"
    why_it_helps_chanting: |
      Bhurijana Prabhu's Vṛndāvana japa classes are among the clearest
      step-by-step instructions on raising attention during rounds —
      the four-step technique (saṅkalpa → neglect the mind → take
      shelter → await mercy) is unpacked plainly. Listen once before
      morning japa for direct application.
    source: "ISKCON Desire Tree Audio Archive"

  - title: "The Mind and the Holy Name — Israel 2005-01-01"
    speaker: "HG Bhurijana Prabhu"
    mp3_url: "https://audio.iskcondesiretree.com/03_-_ISKCON_Prabhujis/ISKCON_Prabhujis_-_A_to_J/His_Grace_Bhurijana_Prabhu/Various/BJP_Various_-_The_Mind_and_the_Holy_name_-_2005-01-01_Israel.mp3"
    folder_url: "https://audio.iskcondesiretree.com/index.php?q=f&f=%2F03_-_ISKCON_Prabhujis%2FISKCON_Prabhujis_-_A_to_J%2FHis_Grace_Bhurijana_Prabhu%2FVarious"
    series: "Israel retreat lectures"
    duration: "~60 min"
    why_it_helps_chanting: |
      One of Bhurijana Prabhu's most cited lectures on japa: the
      relationship between the wandering mind and the Holy Name, with
      concrete practices for keeping the mind from rebelling against
      the round. A clean, considered class to anchor a week of japa.
    source: "ISKCON Desire Tree Audio Archive"

  - title: "Chanting Workshop — Melbourne 2006-05-04"
    speaker: "HG Bhurijana Prabhu"
    mp3_url: "https://audio.iskcondesiretree.com/03_-_ISKCON_Prabhujis/ISKCON_Prabhujis_-_A_to_J/His_Grace_Bhurijana_Prabhu/Various/BJP_Various_-_Chanting_Workshop_-_2006-05-04_Melbourne.mp3"
    folder_url: "https://audio.iskcondesiretree.com/index.php?q=f&f=%2F03_-_ISKCON_Prabhujis%2FISKCON_Prabhujis_-_A_to_J%2FHis_Grace_Bhurijana_Prabhu%2FVarious"
    series: "Melbourne workshops"
    duration: "~75 min"
    why_it_helps_chanting: |
      A live workshop format — Bhurijana Prabhu working through
      chanting difficulties with the audience in real time. Useful when
      you want practical Q&A-style instruction rather than a
      monologue. Especially relevant for householders who face time
      pressure and mind-wandering during rounds.
    source: "ISKCON Desire Tree Audio Archive"

  - title: "Śikṣāṣṭakam — Israel 2006-01-04"
    speaker: "HG Bhurijana Prabhu"
    mp3_url: "https://audio.iskcondesiretree.com/03_-_ISKCON_Prabhujis/ISKCON_Prabhujis_-_A_to_J/His_Grace_Bhurijana_Prabhu/Various/BJP_Various_-_Siksastaka_-_2006-01-04_Israel.mp3"
    folder_url: "https://audio.iskcondesiretree.com/index.php?q=f&f=%2F03_-_ISKCON_Prabhujis%2FISKCON_Prabhujis_-_A_to_J%2FHis_Grace_Bhurijana_Prabhu%2FVarious"
    series: "Śikṣāṣṭakam"
    duration: "~60 min"
    why_it_helps_chanting: |
      Bhurijana Prabhu on the Śikṣāṣṭakam — the eight verses Lord
      Caitanya left as His instruction on chanting. Direct treatment
      of the verse-by-verse mood progression. Pair this lecture with
      the weekly verse if the rotation lands on a Śikṣāṣṭakam quote.
    source: "ISKCON Desire Tree Audio Archive"

  - title: "Holy Name & Japa Mood lectures (Theme-wise)"
    speaker: "HH Rādhānātha Swami"
    mp3_url: null
    folder_url: "https://audio.iskcondesiretree.com/index.php?q=f&f=%2F02_-_ISKCON_Swamis%2FISKCON_Swamis_-_R_to_Y%2FHis_Holiness_Radhanath_Swami%2FLectures"
    series: "Lectures — Theme-wise (118 folders)"
    duration: "~60 min each"
    why_it_helps_chanting: |
      Rādhānātha Swami's lectures on the Holy Name interweave
      Mahābhārata and Bhāgavatam pastimes (Ajāmila, Gajendra,
      Haridāsa Ṭhākura) with concrete sādhana counsel. Most useful
      when your faith in chanting itself needs renewing through
      storytelling. Browse the Theme-wise → Holy Name section for the
      specific mood-on-chanting lectures.
    source: "ISKCON Desire Tree Audio Archive"

  - title: "Holy Name retreat lectures"
    speaker: "HH Sacinandana Swami"
    mp3_url: null
    folder_url: "https://audio.iskcondesiretree.com/index.php?q=f&f=%2F02_-_ISKCON_Swamis%2FISKCON_Swamis_-_R_to_Y%2FHis_Holiness_Sacinandana_Swami"
    series: "Holy Name Retreats (Govardhan / Vṛndāvana)"
    duration: "~75 min × multiple"
    why_it_helps_chanting: |
      Sacinandana Swami's retreat lectures are the closest thing in
      modern ISKCON to a sustained meditation manual for japa — Two
      Doors (mechanical chanting vs. calling out with love), the
      three-step opening, concrete methods to bring the mind to the
      heart before chanting.
    source: "ISKCON Desire Tree Audio Archive"

  - title: "Japa workshops"
    speaker: "HG Mahātmā Prabhu"
    mp3_url: null
    folder_url: "https://audio.iskcondesiretree.com/index.php?q=f&f=%2F03_-_ISKCON_Prabhujis%2FISKCON_Prabhujis_-_K_to_R%2FHis_Grace_Mahatama_Prabhu"
    series: "Japa workshops"
    duration: "~60 min each"
    why_it_helps_chanting: |
      Mahātmā Prabhu's lectures are deliberately practical — short
      techniques, immediately applicable, free of grand language.
      Especially useful when your japa has gone mechanical and you
      need a small lever to change it tomorrow.
    source: "ISKCON Desire Tree Audio Archive"

  - title: "Glories of the Holy Name"
    speaker: "HH Bhakti Cāru Swami"
    mp3_url: null
    folder_url: "https://audio.iskcondesiretree.com/index.php?q=f&f=%2F02_-_ISKCON_Swamis%2FISKCON_Swamis_-_A_to_C%2FHis_Holiness_Bhakti_Charu_Swami"
    series: "Caitanya Caritāmṛta + SB lectures"
    duration: "~60 min"
    why_it_helps_chanting: |
      Bhakti Cāru Swami's voice and pacing themselves are an aid to
      chanting mood. His CC lectures dwell on the līlā of the Name's
      appearance through Lord Caitanya — the lineage gratitude this
      generates is itself a japa-mood stabilizer.
    source: "ISKCON Desire Tree Audio Archive"
