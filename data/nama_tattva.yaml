nama_tattva:
  # ============================================================
  # THE NAME ITSELF
  # ============================================================
  - title: "The Name and Krishna are one"
    teaching: "The Holy Name is not a sound that points to Krishna; it IS Krishna, descending to your tongue. Address Him. Listen for Him. Chanting is meeting, not recitation."
    source: "CC Madhya 17.133, Prabhupada's purport (nama cintamanih krsnah)"

  - title: "The Name is svarāṭ (independent)"
    teaching: "The Holy Name is fully independent. It does not depend on the chanter's qualification, intention, or understanding. But the degree of its fruit varies with the chanter's receptivity."
    source: "Sri Jiva Gosvami; Hari-bhakti-vilasa"

  - title: "Cintamani — touchstone of all desires"
    teaching: "The Holy Name is a touchstone (cintamani) fulfilling all desires. But like a touchstone, it gives what you need, not just what you want. Trust the Name's discrimination."
    source: "Padma Purana, cited in CC Madhya 17.133"

  - title: "No hard rules of time and place"
    teaching: "Unlike Vedic mantras requiring purity, time, and pronunciation, the Holy Name has none. Chant anywhere, anytime, in any condition. The Name does not require qualification."
    source: "Siksastakam 2 (namnam akari); Prabhupada's purport"

  - title: "The yuga-dharma of Kali"
    teaching: "Other yugas required elaborate sadhana. Kali-yuga has one sadhana that works — chanting the Holy Name in congregation. This is the special mercy of the age."
    source: "SB 12.3.51 (kirtanad eva krsnasya)"

  # ============================================================
  # THE THREE CATEGORIES OF CHANTING
  # ============================================================
  - title: "The three stages of the Name"
    teaching: "Nama-aparadha (offensive — blocks the Name), nama-abhasa (semblance — gives liberation), suddha-nama (pure — gives prema). Begin where you are. Each stage purifies through the chanting itself."
    source: "Bhaktivinoda Thakura, Hari-nama-cintamani 1"

  - title: "Nāmābhāsa still delivers"
    teaching: "Even chanting the Name sānketyam (indicating something else), parihāsyam (in jest), stobham (musical), or helā (with neglect) — all destroy unlimited sins. The Name is that powerful."
    source: "SB 6.2.14 (Ajamila narrative)"

  - title: "Ajāmila's classification — sāṅketyam"
    teaching: "Ajāmila called his son Nārāyaṇa, not the Lord. Yet the Vishnudutas came. Indicative chanting (sāṅketyam) without faith still summoned the Lord's attendants. If nāmābhāsa delivered him, what will śuddha-nāma do for us?"
    source: "SB 6.1–3; HG Gauranga Darshan Prabhu's teaching"

  - title: "Why the Name does not 'work'"
    teaching: "The Holy Name, being unhappy with offenses committed against it, does not manifest its complete power in the offender. This is the reason sinful tendencies continue despite chanting."
    source: "Madhurya-kadambini 3.19 by Visvanatha Cakravarti Thakura"

  # ============================================================
  # THE TEN OFFENSES (NAMA-APARADHA)
  # ============================================================
  - title: "First offense — blaspheming a devotee"
    teaching: "Of the ten offenses, criticizing a Vaishnava is the most destructive — even hours of chanting cannot remove it without sincere apology. Guard the tongue when speaking of devotees, especially in their absence."
    source: "Padma Purana, Brahma-khanda 25.15-18"

  - title: "Tenth offense — inattention (pramada)"
    teaching: "After hearing the Name's glories, to still chant inattentively is itself the tenth offense. The remedy is the practice itself — return to attention, again and again."
    source: "Padma Purana — 10th nama-aparadha"

  - title: "Seventh offense — sinning on the Name's strength"
    teaching: "To think 'I can sin freely because chanting clears it' mocks the Name. Sincere chanting brings detachment from sin, not license for it."
    source: "Padma Purana — 7th nama-aparadha"

  - title: "Fifth offense — exaggeration"
    teaching: "When sastra says the Name liberates from all sin, this is not poetic exaggeration — it is precise fact. To consider it an exaggeration is to deny the Name's actual power."
    source: "Padma Purana — 5th nama-aparadha"

  - title: "Aparādha is worse than pāpa"
    teaching: "Pāpa (sin) is destroyed by the Name. Aparādha (offense) blocks the Name's power itself. Chanting destroys sin; offense must be cleared by apology, service, and humility before the Name acts."
    source: "Padma Purana; Madhurya-kadambini"

  # ============================================================
  # THE PROBLEM CHAIN
  # ============================================================
  - title: "The chain of bondage"
    teaching: "Guṇas → Ṣaḍ-Ripu → Anarthas → Pāpa → Aparādha → Blocked. The modes feed the enemies; the enemies generate anarthas; anarthas manifest as sins; sins crystallize into offenses; offenses block the Name."
    source: "Nama-tattva framework synthesizing BG 3.37 and Madhurya-kadambini"

  - title: "Why jīvas are influenced by modes"
    teaching: "The jīva is taṭasthā-śakti — marginal energy. Minute consciousness can be covered; Krishna (vibhu) cannot. Misuse of independence creates guṇa-saṅga, and the soul is bound."
    source: "BG 7.4-5; BG 15.7 (mamaivamso jiva-loke)"

  - title: "False ego — the switch"
    teaching: "The activities of the modes are performed by prakriti, but the soul, bewildered by ahaṅkāra (false ego), thinks 'I am the doer.' False ego is the switch that binds consciousness to material energy."
    source: "BG 3.27, Prabhupada's purport"

  - title: "The four types of anarthas"
    teaching: "Tattva-vibhrama (illusion about knowledge), asat-tṛṣṇā (thirst for the temporary), aparādha (offenses), hṛdaya-daurbalya (weakness of heart). All four bind the jīva to māyā."
    source: "Madhurya-kadambini 3; Bhajana-rahasya"

  - title: "Anartha-nivṛtti is NOT a precondition"
    teaching: "Internal obstacles — lust, anger, greed — clear THROUGH chanting, not before it. Do not wait for purity to begin. Begin in spite of impurity; that IS the purification."
    source: "CC Madhya 19; Bhakti-rasamrta-sindhu"

  # ============================================================
  # THE SIX ENEMIES (SAD-RIPU)
  # ============================================================
  - title: "The six enemies are born from rajas"
    teaching: "Kāma and Krodha are born from rajo-guṇa — the all-devouring, sinful enemy of this world. Lobha and Mada extend from rajas; Moha and Mātsarya from tamas. Conquer the modes; conquer the enemies."
    source: "BG 3.37 (kama esa krodha esa rajo-guna-samudbhavah)"

  - title: "Higher taste defeats lower"
    teaching: "The taste for material things ceases when one experiences the higher taste. Don't fight desire — develop something higher. The Name is the highest taste."
    source: "BG 2.59 (param drstva nivartate)"

  - title: "Three intoxications (mada)"
    teaching: "Bala-mada (pride of strength), strī-mada (intoxication from association), dhana-mada (pride of position). Gajendra fell to all three before his cry for the Lord."
    source: "SB 8.2; Visvanatha Cakravarti's commentary"

  - title: "The chain from object to ruin"
    teaching: "Contemplating sense objects → attachment → lust → anger → delusion → memory bewildered → intelligence destroyed → fall. Catch the chain at the first link."
    source: "BG 2.62-63 (dhyayato visayan pumsah)"

  # ============================================================
  # THE SOLUTION — SIKSHASTAKAM 3
  # ============================================================
  - title: "Tṛṇād api sunīcena — humility"
    teaching: "Humbler than a blade of grass, more tolerant than a tree, offering all respect, expecting none oneself — this mood IS the condition for constant chanting."
    source: "Siksastakam 3 by Sri Caitanya Mahaprabhu"

  - title: "The straw and the storm"
    teaching: "An oak breaks in the storm; a blade of grass bends and rises. Humility is not weakness; it is the wisdom that the storm cannot uproot what does not stand up to it."
    source: "Traditional analogy on Siksastakam 3"

  - title: "The jackfruit tree's tolerance"
    teaching: "A tree only gives — fruit, shade, wood — and never retaliates when wounded. Cultivate this in chanting: when criticized, give something beneficial in return."
    source: "Traditional analogy; Siksastakam 3 (taror api sahisnuna)"

  - title: "Hearing comes before speaking"
    teaching: "The mouth chants for the ear's benefit. If the ear does not hear, the mouth is wasted. Prabhupada repeatedly emphasized: chant slowly enough to hear each syllable."
    source: "NOI verse 1, Prabhupada's purport"

  - title: "Yugala-nāma — both names"
    teaching: "Hare invokes Sri Radha (the energy); Krishna and Rama invoke the Lord. The maha-mantra honors both. Neither name alone is the complete mantra."
    source: "Bhaktivinoda Thakura, Hari-nama-cintamani"

  # ============================================================
  # JAPA METHODS — THE FOUR LINEAGES
  # ============================================================
  - title: "The Two Doors (Sacinandana Swami)"
    teaching: "Door 1: mechanical chanting — pronunciation only, no prema. Door 2: calling out with love — Krishna takes notice. Same beads, same mantras, different doors."
    source: "HH Sacinandana Swami, Learning to Chant with Devotion"

  - title: "The Diamond Throne (Prabhupada)"
    teaching: "Within your heart, create a throne of jewels. Place Krishna there. Wash His lotus feet. Dress Him. Offer Him food. Do all this within while you chant outside."
    source: "Prabhupada, Geneva 1974 lecture"

  - title: "Three-step meditation"
    teaching: "Step 1: 'I am part of Krishna.' Step 2: 'He is my only master.' Step 3: 'Today let me reform my tendency to remain absent.' Begin japa with these three."
    source: "HH Sacinandana Swami, Learning to Chant with Devotion"

  - title: "Bhurijana's 4-step technique"
    teaching: "Saṅkalpa — 'Hear just ONE mantra.' Neglect the mind when it rebels. Take shelter — accept the Name as Krishna Himself. Await mercy. Let the mind embrace the Name."
    source: "HG Bhurijana Prabhu, Japa: Nine Keys from the Siksastakam"

  - title: "Gajendra's formula"
    teaching: "Fix the mind in the heart (samādhāya mano hṛdi), then chant. Mechanical japa becomes powerful meditation. Even an elephant remembered when his moment came — because of practice in a previous life."
    source: "SB 8.3.1"

  # ============================================================
  # GUNA-TATTVA & LIFESTYLE
  # ============================================================
  - title: "Sattvic food affects japa"
    teaching: "Fresh, vegetarian, offered prasadam clears the mind and increases receptivity. Stale, fermented, or intoxicating food creates dullness and restlessness. The tongue and the mind are connected."
    source: "BG 17.8-10; Prabhupada's purports"

  - title: "Brahma-muhurta is sattvika"
    teaching: "1.5 hours before sunrise, the mode of goodness predominates. The Name lands cleanly in a mind not yet disturbed by the day. If you can begin then, the rounds settle faster."
    source: "Hari-bhakti-vilasa; SB 11.18"

  - title: "Bhakti transcends all modes"
    teaching: "One who engages in bhakti-yoga at once transcends the three modes of nature. The Name lifts the chanter above sattva, rajas, and tamas. Sattva is the platform; the Name is the cause of transcendence."
    source: "BG 14.26"

  # ============================================================
  # PASTIMES & ENCOURAGEMENT
  # ============================================================
  - title: "Dhruva's transformation"
    teaching: "Dhruva began with material desire — a kingdom greater than Brahma's. Six months of intense practice transformed the desire itself. When the Lord appeared, Dhruva said: 'I was searching for broken glass and found a diamond.'"
    source: "SB 4.8-9"

  - title: "Prahlada's constant remembrance"
    teaching: "Five years old, persecuted by his demonic father, Prahlada never stopped chanting. Even thrown from a cliff, fed to elephants, given poison — he remembered. The Name protected him."
    source: "SB 7.5"

  - title: "Haridasa Thakura's 300,000"
    teaching: "Haridasa Thakura chanted three lakh Holy Names daily in a cave at Phulia. He is called the Namacarya — the teacher of the Holy Name. His example is the standard the practice points toward."
    source: "Caitanya Bhagavata; CC Antya 3"

  - title: "Anuśikṣitam — past practice matters"
    teaching: "Gajendra's chanting in a previous life saved him as an animal. Every round we chant now prepares us for our moment of complete surrender. No round is ever lost."
    source: "SB 8.3.1; HH Radhanath Swami's commentary"

  - title: "The Name protects even the offender"
    teaching: "Despite our offenses, the Name does not abandon us. It waits patiently for the offender to soften. Continue chanting even when no taste arises; the Name is still working."
    source: "Madhurya-kadambini 3.20"

  # ============================================================
  # PRACTICAL & STRUCTURAL
  # ============================================================
  - title: "Sambandha-jñāna — know the relationship"
    teaching: "Before chanting deeply, know who Krishna is to you — father, friend, master, beloved? Chant in that relationship. The Name reveals itself according to the chanter's mood."
    source: "Brhad-Bhagavatamrta by Sanatana Gosvami"

  - title: "The 'just one more' principle"
    teaching: "When the mind is wild, do not demand 16 rounds. Resolve to hear just ONE mantra fully. Then just one more. Make the request the mind can comply with."
    source: "HG Bhurijana Prabhu's 4-step (saṅkalpa)"

  - title: "The 15-year devotee"
    teaching: "Krishna Dasa chanted 16 rounds for 15 years with no taste. Diagnosis: four hidden offenses (criticism, doubting glories, inattention, pride). Specific remedies, daily, over a year. Transformation followed. The Name was waiting; the chanter was being prepared."
    source: "Composite teaching, Nama-tattva publication"

  - title: "Salt doll in the ocean"
    teaching: "When a salt doll tries to measure the ocean, it dissolves. When the chanter sinks into the Name, the false ego dissolves. This is the goal — not measurement, but melting."
    source: "Bengali Vaishnava bhajan tradition"

  - title: "Chanting is means AND end"
    teaching: "Do not chant to reach somewhere else. Pure chanting IS the destination. The means and the end are the same — which is why no other practice is required."
    source: "CC Madhya 19; Siksastakam 1"
