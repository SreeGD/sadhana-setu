faith_verses:
  - verse_ref: "BG 9.30"
    summary: "Even a person of the most abominable conduct, if engaged in devotional service, is to be considered saintly — because he is properly situated."
    source: "Bhagavad-gita As It Is 9.30, Prabhupada's purport"

  - verse_ref: "CC Madhya 17.133"
    summary: "The Holy Name of Krishna is a touchstone fulfilling all desires; it is Krishna Himself in the form of all spiritual rasa."
    source: "Caitanya Caritamrta Madhya 17.133, citing Padma Purana"

  - verse_ref: "SB 2.1.11"
    summary: "For those who are weary of life and for those who desire to know the highest truth, the chanting of the Holy Name has been determined as the sure path."
    source: "Srimad Bhagavatam 2.1.11, Prabhupada's purport"

  - verse_ref: "SB 12.3.51"
    summary: "Whatever was achieved by meditation in Satya-yuga, by sacrifices in Treta, by temple worship in Dvapara — all of that is achieved in Kali-yuga simply by chanting the Holy Name of Krishna."
    source: "Srimad Bhagavatam 12.3.51, Prabhupada's purport"

  - verse_ref: "BG 18.66"
    summary: "Abandon all varieties of religion and just surrender unto Me. I shall deliver you from all sinful reactions. Do not fear."
    source: "Bhagavad-gita As It Is 18.66, Prabhupada's purport"

  - verse_ref: "BG 9.22"
    summary: "To those who are constantly devoted and worship Me with love, I give the understanding by which they can come to Me. I preserve what they have and give what they lack."
    source: "Bhagavad-gita As It Is 9.22, Prabhupada's purport"

  - verse_ref: "CC Adi 17.21"
    summary: "harer nama harer nama harer namaiva kevalam — In Kali-yuga, only the Name of Hari, only the Name of Hari, only the Name of Hari. There is no other way, no other way, no other way."
    source: "Caitanya Caritamrta Adi 17.21, citing Brhan-Naradiya Purana"

  - verse_ref: "Siksastakam 1"
    summary: "Chanting of the Holy Name cleanses the mirror of the heart, extinguishes the fire of material existence, spreads the moon-rays of benediction, increases the ocean of bliss, gives a taste of the full nectar, and bathes the soul."
    source: "Sri Caitanya Mahaprabhu, Siksastakam verse 1"

  - verse_ref: "Siksastakam 2"
    summary: "In Your Names You have invested all Your powers, and there are no hard and fast rules for chanting them. But despite Your mercy, I am so unfortunate that I have no attraction for them."
    source: "Sri Caitanya Mahaprabhu, Siksastakam verse 2"

  - verse_ref: "SB 6.2.14"
    summary: "By chanting the Holy Name of the Lord, even unconsciously, with reference to something else, jokingly, or in derision — all sinful reactions are nullified."
    source: "Srimad Bhagavatam 6.2.14 (Ajamila narrative)"

  - verse_ref: "SB 11.5.32"
    summary: "In the age of Kali, intelligent persons perform congregational chanting to worship the incarnation of Godhead who constantly sings the names of Krishna."
    source: "Srimad Bhagavatam 11.5.32, predicting Sri Caitanya Mahaprabhu"

  - verse_ref: "CC Adi 7.76"
    summary: "There is no comparison to the result of chanting the Holy Name in the company of devotees. Sankirtana awakens all dormant love for Krishna."
    source: "Caitanya Caritamrta Adi 7"

  - verse_ref: "CC Antya 20.16"
    summary: "I do not want wealth, followers, beauty, or liberation. Let me have unmotivated, uninterrupted devotional service to You, birth after birth."
    source: "Caitanya Caritamrta Antya 20.16, citing Siksastakam 4"

  - verse_ref: "BG 9.34"
    summary: "Always think of Me, become My devotee, worship Me and offer obeisances to Me. Thus, absorbed in Me, you will surely come to Me."
    source: "Bhagavad-gita As It Is 9.34, Prabhupada's purport"

  - verse_ref: "BG 2.40"
    summary: "In this endeavor there is no loss or diminution. Even a little effort on this path can protect one from the most dangerous type of fear."
    source: "Bhagavad-gita As It Is 2.40, Prabhupada's purport"

  - verse_ref: "BG 4.10"
    summary: "Being freed from attachment, fear, and anger, being fully absorbed in Me and taking refuge in Me — many persons have become purified by knowledge of Me and have attained love for Me."
    source: "Bhagavad-gita As It Is 4.10, Prabhupada's purport"

  - verse_ref: "BG 8.5"
    summary: "Whoever, at the time of death, quits his body remembering Me alone, at once attains My nature. Of this there is no doubt."
    source: "Bhagavad-gita As It Is 8.5, Prabhupada's purport"

  - verse_ref: "BG 12.13-14"
    summary: "One who is not envious but is a kind friend to all, who is free from possessiveness, equipoised in happiness and distress, forgiving, satisfied, self-controlled, and engaged in devotional service — such a devotee is very dear to Me."
    source: "Bhagavad-gita As It Is 12.13-14, Prabhupada's purport"

  - verse_ref: "Siksastakam 8"
    summary: "Let Him crush me in His embrace, or break my heart by not appearing — He is still my one and only Lord, unconditionally."
    source: "Sri Caitanya Mahaprabhu, Siksastakam verse 8"

  - verse_ref: "SB 1.2.6"
    summary: "The supreme occupation for all humanity is that by which one can attain to loving devotional service unto the transcendent Lord — uninterrupted, unmotivated, and so satisfying the self."
    source: "Srimad Bhagavatam 1.2.6, Prabhupada's purport"
