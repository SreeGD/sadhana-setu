bhajans:
  - title: "Sri Sri Gurv-astaka"
    author: "Visvanatha Cakravarti Thakura"
    verse_iast: "saṁsāra-dāvānala-līḍha-loka-trāṇāya kāruṇya-ghanāghanatvam | prāptasya kalyāṇa-guṇārṇavasya vande guroḥ śrī-caraṇāravindam ||"
    verse_translation: "The spiritual master is receiving benediction from the ocean of mercy. Just as a cloud pours water on a forest fire to extinguish it, the spiritual master delivers the materially afflicted world by extinguishing the blazing fire of material existence. I offer my respectful obeisances unto the lotus feet of such a spiritual master, who is an ocean of auspicious qualities."
    source: "Sri Sri Gurv-astaka verse 1, sung daily in ISKCON temples"

  - title: "Sri Sri Sad-Gosvamy-astaka"
    author: "Srinivasa Acarya"
    verse_iast: "kṛṣṇotkīrtana-gāna-nartana-parau premāmṛtāmbho-nidhī dhīrādhīra-jana-priyau priya-karau nirmatsarau pūjitau | śrī-caitanya-kṛpā-bharau bhuvi bhuvo bhārāvahantārakau vande rūpa-sanātanau raghu-yugau śrī-jīva-gopālakau ||"
    verse_translation: "I offer my respectful obeisances unto the Six Goswamis — namely Sri Rupa, Sri Sanatana, Sri Raghunatha Bhatta, Sri Raghunatha Dasa, Sri Jiva, and Sri Gopala Bhatta — who were constantly engaged in chanting the Holy Name of Krishna and dancing. They were absorbed in the nectar of love for Krishna, dear to both gentle and rough, free from envy, and ornaments of Sri Caitanya's mercy upon the world."
    source: "Sri Sri Sad-Gosvamy-astaka verse 1 by Srinivasa Acarya"

  - title: "Sri Nama-Sankirtana (Hari Haraye Namah)"
    author: "Narottama Dasa Thakura"
    verse_iast: "hari haraye namaḥ kṛṣṇa yādavāya namaḥ | yādavāya mādhavāya keśavāya namaḥ ||"
    verse_translation: "I offer my obeisances unto Hari, unto Krishna, unto Yadava, unto Madhava, unto Keshava."
    source: "Prarthana by Narottama Dasa Thakura"

  - title: "Bhajahu Re Mana"
    author: "Govinda Dasa Kaviraja"
    verse_iast: "bhajahū re mana śrī-nanda-nandana, abhaya-caraṇāravinda re | durlabha mānava-janma sat-saṅge, taroho e bhava-sindhu re ||"
    verse_translation: "O mind, just worship the lotus feet of the son of Nanda, which are fearless. Having obtained this rare human birth, cross over this ocean of material existence by the association of devotees."
    source: "Bengali Vaishnava bhajan tradition (sometimes anthologized in Padyavali)"

  - title: "Sri Krishna Caitanya Prabhu Daya Kara More"
    author: "Narottama Dasa Thakura"
    verse_iast: "śrī kṛṣṇa caitanya prabhu dayā kara more | tomā vinā ke dayālu jagat-saṁsāre ||"
    verse_translation: "O Sri Krishna Caitanya Prabhu, please be merciful to me — for who in the world of birth and death is more merciful than You?"
    source: "Prarthana by Narottama Dasa Thakura"

  - title: "Saranagati — Tomara Karuna Sara"
    author: "Bhaktivinoda Thakura"
    verse_iast: "tomāra karuṇā sāra, karuṇā bāhirā mahi | abhāgāra prati kṛpā kara nā kara ||"
    verse_translation: "Your mercy is the essence; outside of it there is nothing. Whether You bestow mercy upon this unfortunate one or not is Your own decision."
    source: "Saranagati by Bhaktivinoda Thakura"

  - title: "Sri Hari-Nama"
    author: "Bhaktivinoda Thakura"
    verse_iast: "hari he! tumi to' dayāra sindhu | tomāra caraṇe śaraṇa nilāma, kāhāre kahibo āra ||"
    verse_translation: "O Hari! You are an ocean of mercy. I have taken shelter at Your feet — to whom else can I appeal?"
    source: "Gita-mala by Bhaktivinoda Thakura"

  - title: "Hari Hari, Bifale Janama Gonainu"
    author: "Narottama Dasa Thakura"
    verse_iast: "hari hari, biphale janama goṅāinu | manuṣya-janama pāiyā, rādhā-kṛṣṇa nā bhajiyā, jāniyā śuniyā biṣa khāinu ||"
    verse_translation: "O Hari, O Hari, I have wasted my life in vain. Having obtained a human birth, I did not worship Sri Radha and Sri Krishna — knowingly, I drank poison."
    source: "Prarthana by Narottama Dasa Thakura"

  - title: "Sri Damodarastakam"
    author: "Satyavrata Muni (recited in the month of Karttika)"
    verse_iast: "namāmīśvaraṁ sac-cid-ānanda-rūpaṁ lasat-kuṇḍalaṁ gokule bhrājamānam | yaśodā-bhiyolūkhalād dhāvamānaṁ parāmṛṣṭam atyantato drutya gopyā ||"
    verse_translation: "I offer my obeisances unto the Supreme Lord, whose form is eternal bliss and knowledge, whose ear-rings are swinging as He plays in Gokula. Fleeing in fear from mother Yasoda after breaking the butter pot, He was caught by her, who chased Him swiftly."
    source: "Damodarastakam from Padma Purana, recited in Karttika"

  - title: "Ohe Vaisnava Thakura"
    author: "Bhaktivinoda Thakura"
    verse_iast: "ohe! vaiṣṇava ṭhākura, dayāra sāgara, e dāse karuṇā kari' | diyā pada-chāyā, śodho he āmāya, tomāra caraṇa dhori ||"
    verse_translation: "O respected Vaishnava, ocean of mercy, please be kind to this servant. Give me the shade of your feet and purify me. I cling to your feet."
    source: "Saranagati by Bhaktivinoda Thakura"

  - title: "Gauranga Bolite Habe"
    author: "Narottama Dasa Thakura"
    verse_iast: "gaurāṅga' bolite habe pulaka-śarīra | hari' hari' bolite nayane ba'be nīra ||"
    verse_translation: "When will that day come when, simply by uttering 'Gauranga,' my hair will stand on end? When, simply by chanting 'Hari! Hari!,' tears will flow from my eyes?"
    source: "Prarthana by Narottama Dasa Thakura"

  - title: "Krsna Deva! Bhavantam Vande"
    author: "Rupa Gosvami"
    verse_iast: "kṛṣṇa-deva! bhavantam vande man-mānasa-madhukaram arpaya nija-pāda-paṅkaja-prema-dīrgha-praṇaya-mākaraṇaye ||"
    verse_translation: "O Lord Krishna! I bow to You — please offer the bee of my mind a place on the lotus of Your feet, that long-lasting love for You may grow."
    source: "Stava-mala by Rupa Gosvami"
