  text: ఈ మంత్రాన్నే వినడానికి నేను ప్రయత్నిస్తాను.
- id: 1
  reviewed: false
  text: ఈ నామం — దీన్ని నేను వింటాను.
- id: 2
  reviewed: false
  text: మొదటి 'Hare'ను నేను పట్టుకుంటాను.
- id: 3
  reviewed: false
  text: నేను ఏకాగ్రత నిలపలేకపోవచ్చు, కానీ కూర్చుంటాను. ప్రయత్నమే సాధన.
- id: 4
  reviewed: false
  text: గడ్డిపోచ కంటే వినమ్రంగా, చెట్టు కంటే సహనంతో, ఇతరులకు గౌరవమిస్తూ, తిరిగి ఏదీ
    ఆశించకుండా నేను జపిస్తాను.
- id: 5
  reviewed: false
  text: నామం పనిచేయగలిగేలా ఈ రోజు నేను ప్రతీకారం చేయను — నా మనసులో కూడా.
- id: 6
  reviewed: false
  text: ఈ రోజు నేను కేవలం ఉచ్చరించను — ఆర్తితో పిలుస్తాను.
- id: 7
  reviewed: false
  text: జపం చేస్తున్నప్పుడు అన్యమనస్కంగా ఉండిపోయే నా అలవాటును ఈ రోజు సరిదిద్దుకుంటాను.
- id: 8
  reviewed: false
  text: ఈ రోజు నా నాలుక బయట జపిస్తుండగా, నేను లోపల Kṛṣṇaకు సేవ చేస్తాను.
- id: 9
  reviewed: false
  text: నామాన్ని Kṛṣṇa స్వయంగానే నేను స్వీకరిస్తాను — జపం అంటే కలవడం, కేవలం పఠించడం
    కాదు.
- id: 10
  reviewed: false
  text: మనస్సు తిరుగుబాటు చేసినప్పుడు, దాన్ని పట్టించుకోక నామం వద్దకు తిరిగి వస్తాను.
- id: 11
  reviewed: false
  text: Brahma-muhūrta వచ్చింది. మాలలు సమర్పించకుండా దీన్ని వృథాగా పోనివ్వను.
- id: 12
  reviewed: false
  text: Brahma-muhūrta తప్పిపోయినా, నేను మానను — ఇప్పుడే జపిస్తాను.
- id: 13
  reviewed: false
  text: ఈ రోజు Ekādaśī. మధ్యాహ్నానికి ముందే నా మాలలు పూర్తి చేస్తాను.
- id: 14
  reviewed: false
  text: ఈ రోజు నేను Kṛṣṇa ను నా ప్రభువుగా భావించి జపిస్తాను. ఆ భావంలోనే ఆయనను సంబోధిస్తాను.
- id: 15
  reviewed: false
  text: ఈ రోజు రుచి పరీక్ష కాదు, శ్రద్ధే పరీక్ష. రుచి ఉన్నా లేకపోయినా నేను శ్రద్ధ
    పెడతాను.
- id: 16
  reviewed: false
  text: మొదలుపెట్టడానికి పవిత్రత కోసం వేచి ఉండను. అపవిత్రత ఉన్నా మొదలుపెడతాను — అదే
    శుద్ధీకరణ.
- id: 17
  reviewed: false
  text: నేను పదహారు కావాలని పట్టుబట్టను. ఒకటి అడుగుతాను. తరువాత ఇంకొకటి.
- id: 18
  reviewed: false
  text: నా మనసు తిరిగిపోయినా, తదుపరి mantra అదే తాజా అవకాశం. ఇప్పుడే మళ్ళీ మొదలుపెడతాను.
- id: 19
  reviewed: false
  text: ఈ రాత్రి నా చివరి స్పృహగల ఆలోచన నీ నామమే అవ్వాలి.
