- id: 0
  reviewed: false
  title: నామము మరియు కృష్ణుడు ఒక్కటే
  teaching: పవిత్ర నామము కృష్ణుని సూచించే ఒక ధ్వని కాదు; అది సాక్షాత్తు కృష్ణుడే,
    మీ నాలుకపైకి అవతరిస్తున్నాడు. ఆయనను సంబోధించండి. ఆయన కోసం వినండి. జపము అనేది కలయిక,
    పఠనము కాదు.
- id: 1
  reviewed: false
  title: నామము svarāṭ (స్వతంత్రము)
  teaching: పవిత్ర నామము పూర్తిగా స్వతంత్రము. అది జపించేవారి అర్హత, ఉద్దేశ్యము లేదా
    అవగాహనపై ఆధారపడదు. కానీ దాని ఫలము యొక్క మోతాదు జపించేవారి స్వీకరణశీలతను బట్టి
    మారుతుంది.
- id: 2
  reviewed: false
  title: Cintamani — సకల కోరికలను తీర్చే చింతామణి
  teaching: పవిత్ర నామము సకల కోరికలను తీర్చే చింతామణి (cintamani). కానీ చింతామణి వలెనే,
    అది మీరు కోరుకున్నది మాత్రమే కాక, మీకు అవసరమైనది ఇస్తుంది. నామము యొక్క వివేచనను
    నమ్మండి.
- id: 3
  reviewed: false
  title: కాలము మరియు స్థలమునకు సంబంధించిన కఠిన నియమాలు లేవు
  teaching: శుద్ధి, కాలము మరియు ఉచ్చారణ అవసరమయ్యే వైదిక మంత్రాల వలె కాక, పవిత్ర నామమునకు
    అటువంటి నియమాలు ఏవీ లేవు. ఎక్కడైనా, ఎప్పుడైనా, ఏ స్థితిలోనైనా జపించండి. నామమునకు
    ఎటువంటి అర్హత అవసరం లేదు.
- id: 4
  reviewed: false
  title: కలి యొక్క yuga-dharma
  teaching: ఇతర యుగాలు విస్తృతమైన sadhana ను అవసరం చేశాయి. కలియుగమునకు పనిచేసే ఒకే
    ఒక sadhana ఉంది — సంకీర్తనలో పవిత్ర నామమును జపించడం. ఇది ఈ యుగపు ప్రత్యేక కరుణ.
- id: 5
  reviewed: false
  title: నామం యొక్క మూడు దశలు
  teaching: నామ-అపరాధ (అపరాధయుక్తం — నామాన్ని అడ్డుకుంటుంది), నామ-ఆభాస (ఛాయామాత్రం
    — ముక్తిని ఇస్తుంది), శుద్ధ-నామ (పరిశుద్ధం — ప్రేమను ఇస్తుంది). మీరు ఉన్న చోటు
    నుండే ప్రారంభించండి. ప్రతి దశా జపం ద్వారానే శుద్ధి చేస్తుంది.
- id: 6
  reviewed: false
  title: నామాభాస అయినా ఉద్ధరిస్తుంది
  teaching: నామాన్ని సాంకేత్యం (వేరొకదాన్ని సూచిస్తూ), పరిహాస్యం (పరిహాసంగా), స్తోభం
    (సంగీతంగా), లేదా హేళా (నిర్లక్ష్యంగా) జపించినా — అన్నీ అపరిమిత పాపాలను నశింపజేస్తాయి.
    నామం అంత శక్తివంతమైనది.
- id: 7
  reviewed: false
  title: అజామిళుని వర్గీకరణ — సాంకేత్యం
  teaching: అజామిళుడు తన కుమారుడిని నారాయణ అని పిలిచాడు, భగవంతుడిని కాదు. అయినా విష్ణుదూతలు
    వచ్చారు. విశ్వాసం లేకుండా సూచనామాత్రపు జపం (సాంకేత్యం) అయినా భగవంతుని పరిచారకులను
    రప్పించింది. నామాభాస అతడిని ఉద్ధరించినప్పుడు, శుద్ధ-నామ మనకు ఏమి చేస్తుందో?
- id: 8
  reviewed: false
  title: నామం ఎందుకు 'పని చేయదు'
  teaching: పవిత్ర నామం, తనకు వ్యతిరేకంగా జరిగిన అపరాధాల వల్ల అసంతృప్తి చెంది, అపరాధి
    యందు తన సంపూర్ణ శక్తిని వ్యక్తం చేయదు. జపం చేస్తున్నా పాప ప్రవృత్తులు కొనసాగడానికి
    ఇదే కారణం.
- id: 9
  reviewed: false
  title: మొదటి అపరాధం — భక్తుడిని నిందించడం
  teaching: పది అపరాధాలలో, వైష్ణవుడిని విమర్శించడం అత్యంత వినాశకరమైనది — హృదయపూర్వక
    క్షమాపణ లేకుండా గంటల తరబడి జపించినా దాన్ని తొలగించలేము. భక్తుల గురించి మాట్లాడేటప్పుడు,
    ముఖ్యంగా వారు లేనప్పుడు, నాలుకను అదుపులో ఉంచుకోండి.
- id: 10
  reviewed: false
  title: పదవ అపరాధం — అశ్రద్ధ (pramada)
  teaching: నామ మహిమను విన్న తర్వాత కూడా అశ్రద్ధగా జపించడం — అదే పదవ అపరాధం. దీనికి
    పరిష్కారం సాధనే — మళ్ళీ మళ్ళీ శ్రద్ధకు తిరిగి రావడం.
- id: 11
  reviewed: false
  title: ఏడవ అపరాధం — నామ బలంతో పాపం చేయడం
  teaching: '''జపం పాపాన్ని తొలగిస్తుంది కాబట్టి నేను స్వేచ్ఛగా పాపం చేయవచ్చు'' అని
    తలంచడం నామాన్ని అపహాస్యం చేయడమే. నిష్కపటమైన జపం పాపం పట్ల విరక్తిని కలిగిస్తుంది,
    పాపానికి అనుమతిని కాదు.'
- id: 12
  reviewed: false
  title: ఐదవ అపరాధం — అతిశయోక్తి
  teaching: నామం సర్వ పాపాల నుండి విముక్తి కలిగిస్తుందని శాస్త్రం చెప్పినప్పుడు, అది
    కావ్యపరమైన అతిశయోక్తి కాదు — అది ఖచ్చితమైన సత్యం. దానిని అతిశయోక్తిగా భావించడం
    నామ యథార్థ శక్తిని తిరస్కరించడమే.
- id: 13
  reviewed: false
  title: Aparādha అనేది pāpa కంటే ఘోరమైనది
  teaching: Pāpa (పాపం) నామం చేత నశిస్తుంది. Aparādha (అపరాధం) నామ శక్తినే అడ్డుకుంటుంది.
    జపం పాపాన్ని నశింపజేస్తుంది; కానీ నామం పనిచేయడానికి ముందు అపరాధాన్ని క్షమాపణ,
    సేవ, వినయం ద్వారా తొలగించుకోవాలి.
- id: 14
  reviewed: false
  title: బంధనపు గొలుసు
  teaching: Guṇas → Ṣaḍ-Ripu → Anarthas → Pāpa → Aparādha → అడ్డుకట్ట. గుణాలు శత్రువులను
    పోషిస్తాయి; శత్రువులు anarthaలను పుట్టిస్తాయి; anarthaలు పాపాలుగా వ్యక్తమవుతాయి;
    పాపాలు అపరాధాలుగా గట్టిపడతాయి; అపరాధాలు నామాన్ని అడ్డుకుంటాయి.
- id: 15
  reviewed: false
  title: జీవులు గుణాలచే ఎందుకు ప్రభావితమవుతారు
  teaching: జీవుడు taṭasthā-śakti — తటస్థ శక్తి. అణుచైతన్యాన్ని కప్పివేయవచ్చు; కృష్ణుడిని
    (vibhu) కప్పలేము. స్వాతంత్ర్యాన్ని దుర్వినియోగం చేయడం వల్ల guṇa-saṅga ఏర్పడుతుంది,
    ఆత్మ బంధించబడుతుంది.
- id: 16
  reviewed: false
  title: మిథ్యా అహంకారం — స్విచ్
  teaching: గుణాల కార్యకలాపాలను prakriti నిర్వహిస్తుంది, కానీ ఆత్మ ahaṅkāra (మిథ్యా
    అహంకారం) చేత మోహితమై 'నేనే కర్తను' అని భావిస్తుంది. చైతన్యాన్ని భౌతిక శక్తికి
    బంధించే స్విచ్ మిథ్యా అహంకారమే.
- id: 17
  reviewed: false
  title: నాలుగు రకాల anarthas
  teaching: Tattva-vibhrama (జ్ఞానం గురించిన భ్రమ), asat-tṛṣṇā (అశాశ్వతమైనదానిపై తృష్ణ),
    aparādha (అపరాధాలు), hṛdaya-daurbalya (హృదయ దుర్బలత్వం). ఈ నాలుగూ జీవుడిని māyā
    కు బంధిస్తాయి.
- id: 18
  reviewed: false
  title: Anartha-nivṛtti అనేది ఒక ముందస్తు షరతు కాదు
  teaching: అంతర్గత అడ్డంకులు — కామం, క్రోధం, లోభం — జపం ద్వారానే తొలగిపోతాయి, దానికి
    ముందు కాదు. ప్రారంభించడానికి పవిత్రత కోసం వేచి ఉండకండి. అపవిత్రత ఉన్నప్పటికీ ప్రారంభించండి;
    అదే పవిత్రీకరణ.
- id: 19
  reviewed: false
  title: ఆరుగురు శత్రువులు rajas నుండి జన్మిస్తారు
  teaching: Kāma మరియు Krodha rajo-guṇa నుండి జన్మిస్తాయి — ఈ ప్రపంచపు సర్వభక్షక,
    పాపభూయిష్ఠ శత్రువు. Lobha మరియు Mada rajas నుండి విస్తరిస్తాయి; Moha మరియు Mātsarya
    tamas నుండి. గుణాలను జయించండి; శత్రువులను జయించండి.
- id: 20
  reviewed: false
  title: ఉన్నతమైన రుచి నీచమైన రుచిని జయిస్తుంది
  teaching: ఉన్నతమైన రుచిని అనుభవించినప్పుడు భౌతిక విషయాల పట్ల రుచి అంతరిస్తుంది.
    కోరికతో పోరాడకండి — దానికంటే ఉన్నతమైనదాన్ని పెంపొందించుకోండి. నామమే అత్యున్నతమైన
    రుచి.
- id: 21
  reviewed: false
  title: మూడు మదాలు (mada)
  teaching: Bala-mada (బలగర్వం), strī-mada (స్త్రీసాంగత్యం వల్ల కలిగే మత్తు), dhana-mada
    (పదవీగర్వం). Gajendra భగవంతుని కోసం ఆర్తనాదం చేయకముందు ఈ మూడింటికీ లొంగిపోయాడు.
- id: 22
  reviewed: false
  title: విషయం నుండి వినాశనం వరకు సాగే గొలుసు
  teaching: ఇంద్రియ విషయాలను చింతించడం → ఆసక్తి → కామం → క్రోధం → మోహం → స్మృతిభ్రంశం
    → బుద్ధినాశనం → పతనం. ఈ గొలుసును మొదటి లంకె వద్దనే పట్టుకోండి.
- id: 23
  reviewed: false
  title: Tṛṇād api sunīcena — వినమ్రత
  teaching: గడ్డిపోచ కంటే వినమ్రంగా, వృక్షం కంటే సహనంతో, అందరికీ గౌరవమిస్తూ, తనకు
    ఏదీ ఆశించకుండా — ఈ భావమే నిరంతర నామజపానికి అర్హత.
- id: 24
  reviewed: false
  title: గడ్డిపోచ మరియు తుఫాను
  teaching: తుఫానులో మహావృక్షం విరిగిపోతుంది; గడ్డిపోచ వంగి తిరిగి లేస్తుంది. వినమ్రత
    బలహీనత కాదు; దానికి ఎదురు నిలబడని దాన్ని తుఫాను పెకలించలేదన్న వివేకమే అది.
- id: 25
  reviewed: false
  title: పనస చెట్టు యొక్క సహనం
  teaching: 'చెట్టు ఇవ్వడం మాత్రమే చేస్తుంది — పండ్లు, నీడ, కలప — గాయపరిచినప్పుడు
    ఎన్నడూ ప్రతీకారం తీర్చుకోదు. జపంలో దీనిని పెంపొందించుకోండి: విమర్శించబడినప్పుడు,
    ప్రతిగా ఏదైనా మేలు చేకూర్చేదాన్ని ఇవ్వండి.'
- id: 26
  reviewed: false
  title: వినడం మాట్లాడటానికి ముందు వస్తుంది
  teaching: 'నోరు చెవి ప్రయోజనం కోసం జపిస్తుంది. చెవి వినకపోతే, నోటి జపం వృథా. ప్రభుపాద
    పదేపదే నొక్కిచెప్పారు: ప్రతి అక్షరాన్ని వినగలిగేంత నెమ్మదిగా జపించండి.'
- id: 27
  reviewed: false
  title: Yugala-nāma — రెండు నామాలు
  teaching: Hare శ్రీ రాధను (శక్తిని) ఆహ్వానిస్తుంది; Krishna మరియు Rama భగవంతుని
    ఆహ్వానిస్తాయి. Mahā-mantra రెండింటినీ గౌరవిస్తుంది. ఏ ఒక్క నామం ఒంటరిగా సంపూర్ణ
    మంత్రం కాదు.
- id: 28
  reviewed: false
  title: రెండు ద్వారాలు (Sacinandana Swami)
  teaching: 'ద్వారం 1: యాంత్రిక జపం — ఉచ్చారణ మాత్రమే, prema లేదు. ద్వారం 2: ప్రేమతో
    పిలవడం — Krishna గమనిస్తారు. అవే జపమాలలు, అవే మంత్రాలు, వేర్వేరు ద్వారాలు.'
- id: 29
  reviewed: false
  title: వజ్రాల సింహాసనం (Prabhupada)
  teaching: మీ హృదయంలో, రత్నాల సింహాసనాన్ని సృష్టించండి. అక్కడ Krishna ను ప్రతిష్ఠించండి.
    ఆయన పాద పద్మాలను కడగండి. ఆయనకు వస్త్రాలు అలంకరించండి. ఆయనకు ఆహారం సమర్పించండి.
    మీరు బయట జపిస్తూ ఈ అంతటినీ లోపల చేయండి.
- id: 30
  reviewed: false
  title: Three-step meditation
  teaching: 'Step 1: ''I am part of Krishna.'' Step 2: ''He is my only master.'' Step
    3: ''Today let me reform my tendency to remain absent.'' Begin japa with these
    three.'
- id: 31
  reviewed: false
  title: Bhurijana's 4-step technique
  teaching: Saṅkalpa — 'Hear just ONE mantra.' Neglect the mind when it rebels. Take
    shelter — accept the Name as Krishna Himself. Await mercy. Let the mind embrace
    the Name.
- id: 32
  reviewed: false
  title: Gajendra's formula
  teaching: Fix the mind in the heart (samādhāya mano hṛdi), then chant. Mechanical
    japa becomes powerful meditation. Even an elephant remembered when his moment
    came — because of practice in a previous life.
- id: 33
  reviewed: false
  title: Sattvic food affects japa
  teaching: Fresh, vegetarian, offered prasadam clears the mind and increases receptivity.
    Stale, fermented, or intoxicating food creates dullness and restlessness. The
    tongue and the mind are connected.
- id: 34
  reviewed: false
  title: Brahma-muhurta is sattvika
  teaching: 1.5 hours before sunrise, the mode of goodness predominates. The Name
    lands cleanly in a mind not yet disturbed by the day. If you can begin then, the
    rounds settle faster.
- id: 35
  reviewed: false
  title: భక్తి అన్ని గుణాలను అధిగమిస్తుంది
  teaching: భక్తి-యోగంలో నిమగ్నమైనవాడు వెంటనే ప్రకృతి యొక్క మూడు గుణాలను అధిగమిస్తాడు.
    నామం జపించేవాడిని సత్త్వ, రజస్, తమస్‌లకు అతీతంగా ఉన్నతం చేస్తుంది. సత్త్వం పునాది;
    నామమే అతీతత్వానికి కారణం.
- id: 36
  reviewed: false
  title: ధ్రువుడి పరివర్తన
  teaching: 'ధ్రువుడు భౌతిక కోరికతో ప్రారంభించాడు — బ్రహ్మ రాజ్యం కంటే గొప్ప రాజ్యం
    కోసం. ఆరు నెలల తీవ్ర సాధన ఆ కోరికనే మార్చివేసింది. భగవంతుడు ప్రత్యక్షమైనప్పుడు,
    ధ్రువుడు ఇలా అన్నాడు: ''నేను పగిలిన గాజు కోసం వెతుకుతున్నాను, వజ్రాన్ని కనుగొన్నాను.'''
- id: 37
  reviewed: false
  title: ప్రహ్లాదుడి నిరంతర స్మరణ
  teaching: ఐదేళ్ల వయసులో, తన రాక్షస తండ్రిచే హింసించబడినా, ప్రహ్లాదుడు జపం ఎన్నడూ
    ఆపలేదు. కొండపై నుండి విసిరివేయబడినా, ఏనుగులకు అప్పగించబడినా, విషం ఇవ్వబడినా —
    అతడు స్మరించాడు. నామం అతడిని రక్షించింది.
- id: 38
  reviewed: false
  title: హరిదాస ఠాకురుడి మూడు లక్షలు
  teaching: హరిదాస ఠాకురుడు ఫులియాలోని ఒక గుహలో ప్రతిరోజూ మూడు లక్షల పవిత్ర నామాలను
    జపించేవాడు. ఆయనను నామాచార్యుడు — పవిత్ర నామం యొక్క గురువు అని పిలుస్తారు. ఆయన
    ఆదర్శమే సాధన దిశగా చూపే ప్రమాణం.
- id: 39
  reviewed: false
  title: అనుశిక్షితం — గత సాధన ముఖ్యం
  teaching: గజేంద్రుడు పూర్వజన్మలో చేసిన జపం అతడిని జంతువుగా ఉన్నప్పుడు రక్షించింది.
    ఇప్పుడు మనం జపించే ప్రతి రౌండ్ మన సంపూర్ణ శరణాగతి క్షణానికి మనల్ని సిద్ధం చేస్తుంది.
    ఏ రౌండ్ కూడా ఎన్నడూ వృథా కాదు.
- id: 40
  reviewed: false
  title: నామం అపరాధిని కూడా రక్షిస్తుంది
  teaching: మన అపరాధాలు ఉన్నప్పటికీ, నామం మనలను విడిచిపెట్టదు. అపరాధి మెత్తబడే వరకు
    అది ఓర్పుగా వేచి ఉంటుంది. రుచి కలగనప్పుడు కూడా జపం కొనసాగించండి; నామం ఇంకా పని
    చేస్తూనే ఉంది.
- id: 41
  reviewed: false
  title: Sambandha-jñāna — సంబంధాన్ని తెలుసుకోండి
  teaching: లోతుగా జపించే ముందు, కృష్ణుడు మీకు ఎవరో తెలుసుకోండి — తండ్రినా, స్నేహితుడా,
    ప్రభువా, ప్రియతముడా? ఆ సంబంధంలోనే జపించండి. జపించేవారి భావానికి అనుగుణంగా నామం
    తనను తాను ప్రకటించుకుంటుంది.
- id: 42
  reviewed: false
  title: '''మరొక్కటి మాత్రమే'' అనే సూత్రం'
  teaching: మనస్సు చంచలంగా ఉన్నప్పుడు, 16 రౌండ్లు డిమాండ్ చేయవద్దు. ఒక్క మంత్రాన్ని
    మాత్రమే పూర్తిగా వినాలని సంకల్పించండి. ఆ తర్వాత మరొక్కటి మాత్రమే. మనస్సు పాటించగలిగే
    విన్నపాన్ని చేయండి.
- id: 43
  reviewed: false
  title: 15 ఏళ్ల భక్తుడు
  teaching: 'కృష్ణ దాసు 15 సంవత్సరాలు ఎటువంటి రుచి లేకుండా 16 రౌండ్లు జపించాడు. నిర్ధారణ:
    నాలుగు దాగిన అపరాధాలు (విమర్శ, మహిమలను సందేహించడం, అజాగ్రత్త, గర్వం). నిర్దిష్ట
    పరిహారాలు, ప్రతిరోజూ, ఒక సంవత్సరం పాటు. పరివర్తన అనుసరించింది. నామం వేచి ఉంది;
    జపించేవాడు సిద్ధం చేయబడుతున్నాడు.'
- id: 44
  reviewed: false
  title: సముద్రంలో ఉప్పు బొమ్మ
  teaching: ఉప్పు బొమ్మ సముద్రాన్ని కొలవడానికి ప్రయత్నించినప్పుడు, అది కరిగిపోతుంది.
    జపించేవాడు నామంలో మునిగినప్పుడు, మిథ్యా అహంకారం కరిగిపోతుంది. ఇదే లక్ష్యం — కొలవడం
    కాదు, కరిగిపోవడం.
- id: 45
  reviewed: false
  title: జపమే సాధనం, జపమే సాధ్యం
  teaching: ఎక్కడికో చేరుకోవడానికి జపం చేయవద్దు. శుద్ధ జపమే గమ్యం. సాధనం, సాధ్యం ఒక్కటే
    — అందుకే వేరే ఏ సాధన అవసరం లేదు.
