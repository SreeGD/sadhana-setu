- id: 0
  reviewed: false
  title: Haridasa Thakura — Namacarya
  text: Haridasa Thakura ప్రతిరోజూ Phulia లోని ఒక గుహలో మూడు లక్షల పవిత్ర నామాలను
    జపించేవారు. హింసించబడినప్పుడు, ఇరవై రెండు సంతలలో ఇరవై రెండు కొరడా దెబ్బలు అందుకున్నారు
    — అయినా నామమే ఆయనను రక్షించింది. అందుకే ఆయనను Namacarya అని, పవిత్ర నామపు గురువు
    అని పిలుస్తారు.
- id: 1
  reviewed: false
  title: Ajamila చివరి పలుకు
  text: Ajamila భయంతో మరణిస్తూ, Yamaraja దూతలతో చుట్టుముట్టబడి, తన చిన్న కుమారుని
    పిలిచాడు — అతని పేరు Narayana. భగవంతుని నామపు ఈ అనుకోని ఉచ్చారణ కూడా Vishnudutas
    ను రప్పించింది, వారు అతని ఆత్మను Vaikuntha కు తీసుకువెళ్లారు. స్పృహతో సంబోధించనప్పుడు
    కూడా నామానికి దాని స్వంత శక్తి ఉంది.
- id: 2
  reviewed: false
  title: వేటగాడు Mrgari
  text: వినోదం కోసం జంతువులను సగం చంపే వేటగాడు Mrgari, Narada Muni ని కలిసి ఆయన సౌమ్యతకు
    చలించిపోయాడు. కేవలం శ్రవణ కీర్తనాల ద్వారానే అతను హింసను విడిచిపెట్టాడు — క్రిమికీటకాలను
    నలిపివేస్తానేమోనని గడ్డిపై కూర్చోవడానికి కూడా నిరాకరించాడు. నామం ఆ వేటగాడిని ఋషిగా
    మార్చింది.
- id: 3
  reviewed: false
  title: Sanatana Gosvami యొక్క Govardhana Parikrama
  text: దాదాపు డెబ్బై ఏళ్ల వయసులో ఉన్న Sanatana Gosvami, రక్తం కారుతున్న పాదాలతో ప్రతిరోజూ
    నాలుగు మైళ్ల Govardhana parikrama చేసేవారు. చివరికి Sri Caitanya Mahaprabhu ఆయన
    ముందు ప్రత్యక్షమై, దానిని ఆపమని కోరారు — భక్తుని శరీరం కూడా శ్రద్ధకు అర్హమైనది.
    ప్రయత్నపు ఆదర్శం, మితత్వపు ఆదర్శం ఒకే ఉపదేశంలో కలిసివచ్చాయి.
- id: 4
  reviewed: false
  title: Gambhira లో Mahaprabhu
  text: Jagannatha Puri లో తన చివరి పన్నెండేళ్లలో, Sri Caitanya Mahaprabhu తన రాత్రులను
    Gambhira గదిలో గడిపారు, 'Krishna ఎక్కడ? Krishna ఎక్కడ?' అని ఏడుస్తూ జపిస్తూ. పవిత్ర
    నామం పట్ల ఆయన ఉన్మాదం, అత్యున్నత స్థాయిలో bhava-bhakti ఎలా ఉంటుందో చూపించింది.
- id: 5
  reviewed: false
  title: Bhaktivinoda's Lamp
  text: Bhaktivinoda Thakura, a magistrate by day, wrote Hari-nama-cintamani and many
    other treatises by lamplight at night. Through worldly burdens, the Name made
    him fearless. He is the one who recovered the birthplace of Sri Caitanya Mahaprabhu
    at Mayapur.
- id: 6
  reviewed: false
  title: Putana's Liberation
  text: Putana, sent by Kamsa to kill baby Krishna with poison on her breast, was
    instead given the elevated position reserved for nursing mothers — because she
    had offered her breast, even with murderous intent. The Lord saw only her form
    of giving.
- id: 7
  reviewed: false
  title: The Six Goswamis of Vrindavan
  text: Rupa, Sanatana, Raghunatha Bhatta, Gopala Bhatta, Jiva, and Raghunatha Dasa
    — the six Goswamis — slept three hours, ate one chapati, walked from temple to
    temple, and chanted day and night. From their lives the entire literature of Gaudiya
    Vaishnavism flowed.
- id: 8
  reviewed: false
  title: Narottama's 'Hari Hari, Bifale'
  text: 'Narottama Dasa Thakura sang: ''Hari Hari, bifale janama gonainu'' — Hari,
    Hari, I have wasted my birth without bhakti. His lament became a song that has
    guided generations back to the practice.'
- id: 9
  reviewed: false
  title: Nalakuvara and Manigriva
  text: Two sons of Kuvera, cursed by Narada to become trees in Nanda Maharaja's courtyard,
    were freed when baby Krishna, dragging a mortar between them, uprooted both. Even
    those bound by the consequence of pride found liberation through the Lord's lila.
- id: 10
  reviewed: false
  title: ఐదేళ్ల వయసులో Dhruva
  text: కేవలం ఐదేళ్ల వయసున్న Dhruva, తన సవతి తల్లిచే మందలించబడి, భగవంతుని వెతుకుతూ
    అడవికి వెళ్ళాడు. ఆరు నెలల ఏకాగ్రచిత్త సాధన తర్వాత — తక్కువ తక్కువగా తింటూ, మరింత
    లోతుగా శ్వాస తీసుకుంటూ, Narada తనకు నేర్పిన రూపాన్ని ధ్యానిస్తూ — Krishna అతని
    ముందు ప్రత్యక్షమయ్యాడు.
- id: 11
  reviewed: false
  title: Prahlada యొక్క స్థిరత్వం
  text: రాక్షసుడైన Hiranyakashipu యొక్క ఐదేళ్ల కుమారుడు Prahlada, తన తండ్రి అతన్ని
    కొండపై నుండి తోసివేయించినా, ఏనుగుల కాళ్ళ కింద పడవేయించినా, విషం ఇచ్చినా — Krishna
    నామస్మరణను ఎన్నడూ ఆపలేదు. ఆ నామం అతన్ని రక్షించింది; అతని తండ్రి అతన్ని మౌనం చేయించలేకపోయాడు.
- id: 12
  reviewed: false
  title: చెట్ల కింద Rupa Gosvami
  text: ఒకప్పుడు ప్రధానమంత్రిగా ఉన్న Rupa Gosvami, తన సమస్త సంపదను భక్తులకు అన్నదానం
    చేయడానికి వెచ్చించి, ఆపై Vrindavan లో చెట్ల కింద నివసిస్తూ Bhakti-rasamrta-sindhu
    — భక్తి రసమయ సముద్రాన్ని రచించాడు. సరళత నుండే భక్తి శాస్త్రం ఆవిర్భవించింది.
- id: 13
  reviewed: false
  title: Ramanuja యొక్క గోపుర ప్రకటన
  text: 'ఎవరికీ చెప్పవద్దన్న ఆదేశంతో తన గురువు నుండి అత్యంత పవిత్రమైన మంత్రాన్ని పొందిన
    Ramanujacarya, ఆలయ గోపురాన్ని ఎక్కి వినగలిగే అందరికీ ఆ మంత్రాన్ని బిగ్గరగా చాటాడు.
    ఎందుకు అవిధేయత చూపావని అడిగినప్పుడు, అతను ఇలా బదులిచ్చాడు: ''నా అవిధేయత వారిని
    ఉద్ధరిస్తే, ఆ పర్యవసానాలను నేను సంతోషంగా స్వీకరిస్తాను.'''
- id: 14
  reviewed: false
  title: Govinda ద్వారం వద్ద Madhavendra Puri
  text: తీవ్రమైన భక్తి కోసం తపిస్తూ, ఆహారం కోసం యాచించడానికి నిరాకరించిన Madhavendra
    Puri ని, పాలు తెచ్చి ఇచ్చిన ఒక చిన్న గోపబాలుని వేషంలో స్వయంగా Krishna యే వెతుక్కుంటూ
    వచ్చి కనుగొన్నాడు. తనను మాత్రమే సేవించేవారిని భగవంతుడు సేవిస్తాడు.
- id: 15
  reviewed: false
  title: శ్రీ చైతన్య మహాప్రభువు పంచ-తత్త్వం
  text: శ్రీ చైతన్య మహాప్రభువు స్వయంగా నిత్యానంద ప్రభువు, శ్రీ అద్వైత, గదాధర పండిత,
    మరియు శ్రీవాస ఠాకుర వారితో కలిసి హరినామాన్ని జపించారు — సంకీర్తన ఉద్యమానికి మూలమైన
    ఈ ఐదుగురు కలిసి ఏర్పడ్డారు. వారి కీర్తన తరువాత వచ్చిన అందరికీ ప్రమాణాన్ని నిర్దేశించింది.
- id: 16
  reviewed: false
  title: భక్తిసిద్ధాంత వారి 64 మాలలు
  text: శ్రీల ప్రభుపాదుల ఆధ్యాత్మిక గురువు అయిన భక్తిసిద్ధాంత సరస్వతి ఠాకుర, ప్రతిరోజూ
    అరవై నాలుగు మాలలు జపించే వ్రతాన్ని స్వీకరించారు — నిర్దేశిత కనిష్ఠ సంఖ్యకు నాలుగు
    రెట్లు. ఆయన ఆదర్శం ఆధునిక గౌడీయ ఆచరణను వ్యక్తిగత సాధనలో స్థిరపరిచింది.
- id: 17
  reviewed: false
  title: టాంప్‌కిన్స్ స్క్వేర్ పార్క్‌లో శ్రీల ప్రభుపాద
  text: డెబ్బై సంవత్సరాల వయసులో, నలభై రూపాయలు మరియు పుస్తకాల పెట్టెతో ఒంటరిగా, శ్రీల
    ప్రభుపాద 1966లో న్యూయార్క్ నగరంలోని టాంప్‌కిన్స్ స్క్వేర్ పార్క్‌లో ఒక చెట్టు
    క్రింద జపించారు. ఆ చెట్టు నుండే ఇస్కాన్ ఆరంభమైంది. ఆరంభించడానికి ఏదీ మరీ ఆలస్యం
    కాదని ఆయన నిరూపించారు.
