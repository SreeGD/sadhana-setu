- id: 0
  reviewed: false
  text: నేను కృష్ణుని నిత్య సేవకుడను.
- id: 1
  reviewed: false
  text: ఈ రోజు నేను కేవలం పవిత్ర నామమునే ఆశ్రయిస్తాను.
- id: 2
  reviewed: false
  text: నామము మరియు కృష్ణుడు అభిన్నులు — నామజపమే ఆయనను కలవడం.
- id: 3
  reviewed: false
  text: నీవు తప్ప నాకు వేరే ఆశ్రయము లేదు.
- id: 4
  reviewed: false
  text: నామజపము ద్వారా నా హృదయ దర్పణము శుద్ధి అవుతుంది.
- id: 5
  reviewed: false
  text: సర్వ ధర్మములను విడిచిపెట్టి, నిన్నొక్కనినే శరణు పొందుతాను.
- id: 6
  reviewed: false
  text: నేను కర్తను కాను. నామమే పని చేస్తుంది; నేను కేవలం సాక్షిగా ఉంటాను.
- id: 7
  reviewed: false
  text: నీ కృపయే సారాంశము; దానికి సాటి మరేదీ లేదు.
- id: 8
  reviewed: false
  text: గడ్డిపోచ కంటే వినమ్రమైన భావముతో నేను నామజపము చేయనివ్వు.
- id: 9
  reviewed: false
  text: ఈ రోజు నేను నా నాలుక, చెవి, మనస్సులతో నామమును సేవిస్తాను.
- id: 10
  reviewed: false
  text: శ్రీ చైతన్య మహాప్రభు, నిత్యానంద ప్రభువు — మీ పాదముల వద్ద నేను శరణు పొందుతాను.
- id: 11
  reviewed: false
  text: నామము లేకపోతే జీవితము ధూళి; నామముతో జీవితము అమృతము.
- id: 12
  reviewed: false
  text: పవిత్ర నామమే నా ఏకైక సంపద.
- id: 13
  reviewed: false
  text: మరెవరినీ తలవని వారికి నేను చెందుతాను; వారికున్నదానిని నీవే కాపాడుతావు.
- id: 14
  reviewed: false
  text: 'ఈ రోజు సంకల్పము: పదహారు మాలలు, శ్రవణము ద్వారా అర్పించబడినవి.'
- id: 15
  reviewed: false
  text: నేను వైష్ణవుల పాద ధూళిని; వారిని కూడా సేవించనివ్వు.
- id: 16
  reviewed: false
  text: నామము రోజంతా నా నాలుకపై నృత్యము చేయుగాక.
- id: 17
  reviewed: false
  text: ప్రతి క్షణమున, ముఖ్యంగా అంత్య క్షణమున నిన్ను స్మరించనివ్వు.
- id: 18
  reviewed: false
  text: నాకున్నదంతా నీదే; ఈ నామజపమే నా శ్రేష్ఠమైన అర్పణ.
- id: 19
  reviewed: false
  text: కృష్ణుడే యజమాని; నేను కేవలం ఆయన సేవకుడను.
- id: 20
  reviewed: false
  text: ఈ కలియుగమున నామజపమే ఏకైక మార్గము.
- id: 21
  reviewed: false
  text: నేను అయోగ్యుడనైనప్పటికీ పవిత్ర నామము నన్ను స్వీకరిస్తుంది.
- id: 22
  reviewed: false
  text: నాకు నామమును అందించిన నా గురువుకు నమస్కరిస్తాను.
- id: 23
  reviewed: false
  text: అపరాధ రహితమైన శుద్ధ-నామమును జపించాలని నేను ఆకాంక్షిస్తాను.
- id: 24
  reviewed: false
  text: ఈ రోజు నా హృదయము మెత్తబడనివ్వు; నామము లోనికి చొచ్చుకొనిపోనివ్వు.
