- id: 0
  reviewed: false
  translation: 'మహర్షులలో నేను భృగువును; శబ్దములలో నేను దివ్యమైన ఓంకారమును. యజ్ఞములలో
    నేను పవిత్ర నామజపమును [జప-యజ్ఞమును], స్థిరమైన వస్తువులలో నేను హిమాలయములను.

    '
  mood_brought: పరమ యజ్ఞముగా జపము
  chanting_connection: 'జపమే తాను అయిన యజ్ఞమని కృష్ణుడే స్వయంగా చెప్పుచున్నాడు. ప్రతి
    పూస ఒక వ్యక్తిగత అభ్యాసము కాదు — అది మీ నాలుక ద్వారా కృష్ణుడే యజ్ఞమును ఆచరించుట.
    మొదటి రౌండుకు ముందు దీనిని మనసులో నిలుపుకొనుడి.

    '
- id: 1
  reviewed: false
  translation: 'కృష్ణుని పవిత్ర నామము సమస్త ఆధ్యాత్మిక ఆశీర్వాదములను ప్రసాదించు దివ్యానంద
    స్వరూపము, ఏలయన అది సమస్త ఆనందమునకు నిధి అయిన కృష్ణుడే. కృష్ణుని నామము సంపూర్ణము,
    పవిత్రము, నిత్యముక్తము, ఏలయన నామమునకు నామికి భేదము లేదు.

    '
  mood_brought: నామము కృష్ణునితో అభిన్నమను విశ్వాసము
  chanting_connection: 'మీరు ఉచ్చరించు అక్షరములే సాక్షాత్తు కృష్ణుడే అను అవగాహనతో
    జపము చేయుడి. నామమునకు నామికి మధ్య అంతరము లేదు — కలయిక ఇప్పటికే జరిగినది. శ్రద్ధతో
    పలుకుడి; ఆయన వినుచున్నాడు.

    '
- id: 2
  reviewed: false
  translation: 'ఈ కలహ కపట యుగమున ముక్తికి ఏకైక మార్గము భగవంతుని పవిత్ర నామమును జపించుటయే.
    వేరే మార్గము లేదు. వేరే మార్గము లేదు. వేరే మార్గము లేదు.

    '
  mood_brought: నిశ్చల స్పష్టత — చేయవలసినది మరేమియు లేదు
  chanting_connection: 'ప్రత్యామ్నాయ విధానము కొరకు, మెరుగుదల కొరకు, సమాంతర మార్గము
    కొరకు వెదకుట ఆపుడి. మూడుసార్ల పునరావృతి ఆ అన్వేషణను ముగించును. ఈ ఒక్క ఆదేశమే సమస్త
    ధర్మమైనట్లు జపమును ప్రారంభించుడి — ఏలయన ఈ యుగమున అదే నిజము.

    '
- id: 3
  reviewed: false
  translation: 'హృదయమను అద్దమును శుభ్రపరచి, భౌతిక అస్తిత్వమను మండుచున్న అగ్నిబాధలను
    ఆపగల శ్రీకృష్ణ భగవానుని పవిత్ర నామజపమునకు సర్వ విజయమగుగాక. ఆ జపమే సౌభాగ్యమను తెల్లని
    కమలమును వికసింపజేయు వర్ధమాన చంద్రుడు, సమస్త దివ్యజ్ఞానమునకు ప్రాణము, నిత్యము విస్తరించు
    ఆనంద సాగరము, ప్రతి అడుగునందు పరిపూర్ణ అమృతము, ఆత్మకు స్నానము.

    '
  mood_brought: సంకీర్తనం యొక్క విశాలత్వం
  chanting_connection: 'ఒకే శ్లోకంలో ఎనిమిది ప్రభావాలు: అద్దం శుభ్రమవుతుంది, దావానలం
    ఆరిపోతుంది, చంద్రుడు ఉదయిస్తాడు, జ్ఞానం వెల్లడవుతుంది, సముద్రం విస్తరిస్తుంది,
    ప్రతి అడుగులో అమృతం రుచి చూడబడుతుంది, అమృతంలో స్నానం. ఈ ప్రభావాలు ఇప్పటికే జరుగుతున్నట్లుగా
    జపాన్ని ప్రారంభించండి — నిజంగా అవి జరుగుతున్నాయి.

    '
- id: 4
  reviewed: false
  translation: 'తనను వీధిలోని గడ్డిపోచ కంటే తక్కువగా భావిస్తూ, వినమ్రమైన మనఃస్థితిలో
    భగవంతుని పవిత్ర నామాన్ని జపించాలి; చెట్టు కంటే ఎక్కువ సహనశీలుడై, ఏ విధమైన మిథ్యా
    ప్రతిష్ఠ లేకుండా, ఇతరులందరికీ గౌరవం ఇవ్వడానికి సిద్ధంగా ఉండాలి. అటువంటి మనఃస్థితిలో
    భగవంతుని పవిత్ర నామాన్ని నిరంతరం జపించవచ్చు.

    '
  mood_brought: జపానికి అసలైన అర్హత
  chanting_connection: 'ఇది జపం తర్వాత చేరుకోవలసిన లక్ష్యం కాదు — ఇది ముందస్తు షరతు.
    30 సెకన్లు తీసుకొని నిజంగా అనుభవించండి: గడ్డిపోచ కంటే తక్కువ, చెట్టు కంటే ఎక్కువ
    సహనశీలం, ఏ గౌరవమూ ఆశించకుండా, అందరికీ గౌరవం ఇస్తూ. ఆపై ప్రారంభించండి.

    '
- id: 5
  reviewed: false
  translation: 'ఓ సర్వశక్తిమంతుడైన భగవంతుడా, నాకు సంపదను కూడబెట్టుకోవాలనే కోరిక లేదు,
    అందమైన స్త్రీలను కోరను, ఎంతమంది అనుచరులనూ కోరను. నేను కేవలం జన్మజన్మలకు నీ నిష్కారణ
    భక్తిసేవను మాత్రమే కోరుకుంటాను.

    '
  mood_brought: శుద్ధమైన ప్రార్థన
  chanting_connection: 'త్యజించబడిన నాలుగు విషయాలు (సంపద, స్త్రీలు/అనుచరులు, కవిగా
    కీర్తి) — జపం చేస్తున్నప్పుడు కూడా బద్ధ మనస్సు వీటి చుట్టూనే తిరిగే నాలుగు కీలకాంశాలు.
    జపానికి ముందు వీటిని ఒక్కసారి విడిచిపెట్టండి, అప్పుడు రౌండ్లు స్వేచ్ఛగా సాగుతాయి.

    '
- id: 6
  reviewed: false
  translation: 'జీవుని స్వరూపసిద్ధ స్థితి కృష్ణుని శాశ్వత సేవకుడిగా ఉండటమే, ఎందుకంటే
    అతడు కృష్ణుని తటస్థ శక్తి, మరియు భగవంతునితో ఏకకాలంలో అభిన్నమూ భిన్నమూ అయిన ఒక
    ప్రకటనం.

    '
  mood_brought: స్మరించబడిన స్వరూపం
  chanting_connection: 'జపానికి ముందు ఆ సంబంధాన్ని తిరిగి పొందండి: అన్వేషకుడు కాదు,
    విద్యార్థి కాదు,

    ఆకాంక్షి కాదు — నిత్య సేవకుడు. చేయి జపమాలను ఆ గుర్తింపు నుండే

    తీసుకుంటుంది, మరే ఇతర దాని నుండి కాదు.

    '
- id: 7
  reviewed: false
  translation: 'కేవలం కృష్ణుని పవిత్ర నామాన్ని జపించడం ద్వారానే భౌతిక అస్తిత్వం నుండి

    ముక్తిని పొందవచ్చు. నిజంగా, కేవలం హరే కృష్ణ మంత్రాన్ని జపించడం ద్వారానే

    భగవంతుని పాద పద్మాలను దర్శించగలుగుతారు.

    '
  mood_brought: గమ్యం స్పష్టమైంది
  chanting_connection: 'చైతన్య మహాప్రభు ఫలితాన్ని రెండు పంక్తులలో చెబుతారు: సంసారం
    నుండి

    ముక్తి, మరియు కృష్ణుని పాద పద్మాలు. మీరు చేరుకుంటారో లేదో అనే ఆందోళనతో

    కాదు, గమ్యాన్ని దృష్టిలో ఉంచుకొని జపాన్ని ప్రారంభించండి.

    '
- id: 8
  reviewed: false
  translation: 'కావున భక్తి సేవ పట్ల విముఖత కలిగిన వ్యక్తి నోటిలో కృష్ణుని పవిత్ర
    నామం

    ప్రకటం కాదు, అటువంటి వ్యక్తికి భక్తి-యోగ మాధుర్యపు రుచి ఎన్నడూ

    వ్యక్తం కాదు.

    '
  mood_brought: రుచి కోసం ప్రార్థన
  chanting_connection: 'నామం ప్రతి నోటిలోనూ సమానంగా ప్రవేశించదు — దానికి సుకృతి అవసరం.

    జపాన్ని మీరు నామానికి చేసే పనిగా కాదు, నామం మీకు చేయడానికి

    అనుమతించే పనిగా సమీపించండి. ముందుగా ప్రార్థించండి; తరువాత జపించండి.

    '
- id: 9
  reviewed: false
  translation: 'శుద్ధ భక్తునితో క్షణకాలపు సాంగత్యం ద్వారా కూడా సర్వ సాఫల్యాన్ని

    పొందవచ్చన్నదే సమస్త ప్రకట శాస్త్రాల తీర్పు.

    '
  mood_brought: అరువు తెచ్చుకున్న బలం
  chanting_connection: 'ఈ రోజు మీకున్న జపశక్తి ఏదైనా, అది భక్త సాంగత్యం నుండి వచ్చింది
    —

    గురువులు, గ్రంథాలు, కీర్తన. జపానికి ముందు ఒక్క భక్తుని స్మరించండి.

    వారి భావం మీ భావానికి తోడ్పడుతుంది.

    '
- id: 10
  reviewed: false
  translation: కలియుగంలో బుద్ధిమంతులైనవారు, నిరంతరం కృష్ణుని నామాలను గానం చేసే భగవంతుని
    అవతారాన్ని ఆరాధించడానికి సంకీర్తనం చేస్తారు. ఆయన శరీరఛాయ నల్లనిది కాకపోయినా, ఆయన
    కృష్ణుడే. ఆయన తన పార్షదులు, సేవకులు, ఆయుధాలు, మరియు అంతరంగ సహచరులతో కూడి ఉంటాడు.
  mood_brought: పరంపర పట్ల కృతజ్ఞత
  chanting_connection: నీవు ఇప్పుడు చేసే నామజపం, ఈ యుగంలోని బుద్ధిమంతులైన ఆత్మలు ఎల్లప్పుడూ
    చేసినదే. Caitanya Mahāprabhu, Six Goswāmīs, నీ స్వంత guru-paramparā — వీరందరినీ
    కలిగిన ప్రవాహంలో నీవూ ఒక భాగమే. అందులో అడుగుపెట్టు.
- id: 11
  reviewed: false
  translation: ప్రతి ఒక్కరి హృదయంలో Paramātmā గా ఉండి, సత్యవంతుడైన భక్తునికి హితకారి
    అయిన భగవానుడు Śrī Kṛṣṇa — సరిగ్గా శ్రవణం, కీర్తనం చేసినప్పుడు తమంతట తాముగా పుణ్యప్రదమైన
    ఆయన సందేశాలను వినాలనే ఆకాంక్ష కలిగిన భక్తుని హృదయం నుండి భౌతిక భోగవాంఛను తొలగిస్తాడు.
  mood_brought: శుద్ధీకరణపై నమ్మకం
  chanting_connection: 'హృదయాన్ని శుద్ధి చేస్తున్నది నీవు కాదు — హృదయంలోని Krishna.
    నీ పని కేవలం నీ వంతు అందించడం: శ్రవణం, కీర్తనం. మిగతాదంతా ఆయనే చేస్తాడు. japa
    ను ఒక యుద్ధంగా కాక, ఒక అర్పణగా ప్రారంభించు.'
- id: 12
  reviewed: false
  translation: Bhāgavatam పై జరిగే తరగతులకు క్రమం తప్పక హాజరవడం ద్వారా, మరియు శుద్ధ
    భక్తునికి సేవ చేయడం ద్వారా, హృదయాన్ని కలవరపెట్టే సమస్తమూ దాదాపు పూర్తిగా నశిస్తుంది,
    మరియు దివ్య గీతాలతో స్తుతించబడే భగవానునిపై ప్రేమపూర్వక సేవ తిరుగులేని సత్యంగా
    స్థిరపడుతుంది.
  mood_brought: క్రమమైన సంచయం
  chanting_connection: ప్రతి రోజు చేసే japa ఒక డిపాజిట్. ఆ సంచిత ఫలితమే naiṣṭhika-bhakti
    ని స్థిరపరుస్తుంది. ఏడాది రోజులు మాత్రమే చేయగలిగినదాన్ని ఈ రోజు రౌండ్లు చేయాలని
    ఆశించకు. ఈ రోజు వంతు మాత్రం డిపాజిట్ చెయ్యి.
- id: 13
  reviewed: false
  translation: మరోవైపు, అపరిమితుడైన పరమ ప్రభువు యొక్క నామం, కీర్తి, రూపాలు, లీలలు
    మొదలైనవాటి దివ్య మహిమల వర్ణనలతో నిండిన సాహిత్యం ఒక భిన్నమైన సృష్టి; ఈ ప్రపంచంలోని
    తప్పుదోవ పట్టిన నాగరికత యొక్క అపవిత్ర జీవితాలలో ఒక విప్లవాన్ని తీసుకురావడానికి
    ఉద్దేశించిన దివ్య పదాలతో అది నిండి ఉంటుంది. అటువంటి దివ్య సాహిత్యం, అసంపూర్ణంగా
    రచించబడినప్పటికీ, పూర్తిగా నిజాయితీ గల శుద్ధ పురుషులచే శ్రవణం చేయబడుతుంది, గానం
    చేయబడుతుంది, స్వీకరించబడుతుంది.
  mood_brought: అపరిపూర్ణత అడ్డంకి కాదు
  chanting_connection: 'అపరిపూర్ణమైన జపమైనా, అది నామాన్ని కలిగి ఉంటే, పాపమయ స్థితిని
    సమూలంగా మార్చేస్తుంది. మొదలుపెట్టడానికి పరిపూర్ణత కోసం ఎదురుచూడకండి. అపరిపూర్ణంగానే
    మొదలుపెట్టండి; ఆ మార్పును నామమే చేస్తుంది.

    '
- id: 14
  reviewed: false
  translation: 'భగవంతుని భక్తి సేవలో నిమగ్నమవ్వడానికి తన భౌతిక వృత్తులను విడిచిపెట్టినవాడు,
    అపరిపక్వ దశలో ఒక్కోసారి పతనం చెందినా, అతడు విఫలమయ్యే ప్రమాదం లేదు. మరోవైపు, అభక్తుడు
    తన వృత్తిధర్మాలలో పూర్తిగా నిమగ్నమై ఉన్నా, ఏమీ పొందలేడు.

    '
  mood_brought: ప్రయత్నించే ధైర్యం
  chanting_connection: 'ఈ రోజు అశ్రద్ధగా జపం చేసినా, రేపు నీ ప్రమాణాన్ని అందుకోలేకపోయినా,
    ఆ జమ పోదు. అభ్యాసమే ఆ జమ. వైఫల్యానికి భయపడి వెనకడుగు వేయకుండా మొదలుపెట్టు.

    '
- id: 15
  reviewed: false
  translation: 'భగవంతుని పవిత్ర నామ జపంతో మొదలయ్యే భక్తి సేవ, మానవ సమాజంలోని జీవునికి
    అత్యున్నతమైన ధర్మ సూత్రం.

    '
  mood_brought: అత్యావశ్యకమైనది
  chanting_connection: 'మిగతా dharmas అన్నీ ఈ కేంద్ర కార్యానికి అలంకారాలు మాత్రమే.
    Yamarāja స్వయంగా తన సేవకులకు ఈ విషయాన్ని ఉపదేశిస్తాడు. నీ జప రౌండ్లు మొదలుపెడుతూ,
    నీవు కేంద్ర కార్యాన్నే చేస్తున్నావు — ఇది పక్క అభ్యాసం కాదు.

    '
- id: 16
  reviewed: false
  translation: 'Prahlāda Mahārāja ఇలా అన్నాడు: Viṣṇu భగవానుని దివ్యమైన నామం, రూపం,
    గుణాలు, పరికరాలు మరియు లీలల గురించి వినడం మరియు కీర్తించడం, వాటిని స్మరించడం,
    భగవంతుని పాదపద్మాలను సేవించడం, పదహారు రకాల పరికరాలతో భగవంతుని భక్తిపూర్వకంగా అర్చించడం,
    భగవంతునికి ప్రార్థనలు అర్పించడం, ఆయన సేవకుడు కావడం, భగవంతుని తన ఉత్తమ మిత్రునిగా
    భావించడం, మరియు సర్వస్వాన్ని ఆయనకు సమర్పించడం — ఈ తొమ్మిది ప్రక్రియలు శుద్ధ భక్తి
    సేవగా అంగీకరించబడ్డాయి.

    '
  mood_brought: śravaṇa-kīrtana ప్రాధాన్యత
  chanting_connection: ప్రహ్లాదుడు శ్రవణాన్ని, కీర్తనను అన్నిటికంటే మొదట పేర్కొంటాడు
    — స్మరణ, సేవ, ప్రార్థన కంటే ముందు. మీరు ఇప్పుడు ఆ మూలమైన రెండింటిని చేస్తున్నారు.
    మిగతావన్నీ ఈ రెండింటి మీదే నిర్మితమవుతాయి. ఆ క్రమం స్పష్టంగా ఉంచుకొని మొదలుపెట్టండి.
- id: 17
  reviewed: false
  translation: నా ప్రియమైన ప్రభూ, నిన్ను గురించి మనస్సుతో ఊహాగానం చేసే ప్రయత్నాలను
    పూర్తిగా విడిచిపెట్టి, బదులుగా శుద్ధ భక్తుల నోటి నుండి నిన్ను గురించి కేవలం వింటూ,
    తమ తమ వృత్తిపరమైన స్థానాలలో ఉంటూనే తమ శరీరాన్ని, మనస్సును, మాటలను నీ సేవలో అర్పిస్తూ
    జీవితాన్ని గడిపే భక్తులు — నీవు ఇతరథా అజేయుడవైనప్పటికీ, అటువంటివారు నిన్ను నిశ్చయంగా
    జయిస్తారు.
  mood_brought: ఊహాగానాన్ని వదిలి, కేవలం వినండి
  chanting_connection: కీర్తన గురించి ఆలోచించడం ఆపి, కేవలం కీర్తనను వినండి. శరీరం-మనస్సు-మాటలతో
    భక్తుల నుండి వినేవారు అజేయుడిని జయిస్తారన్నదే శాస్త్రాల తీర్పు. వినడమే ఏకైక తాళంచెవి.
- id: 18
  reviewed: false
  translation: పరమ ప్రభువు యొక్క పవిత్ర నామాన్ని జపించడం ద్వారా మనిషి భగవత్ప్రేమ స్థితికి
    చేరుకుంటాడు. అప్పుడు భక్తుడు ప్రభువు యొక్క నిత్య సేవకుడిగా తన వ్రతంలో స్థిరపడతాడు,
    క్రమంగా ప్రభువు యొక్క ఒక నిర్దిష్ట నామం, రూపం పట్ల అనురక్తుడవుతాడు. అతని హృదయం
    పారవశ్య ప్రేమలో కరిగిపోతుండగా, అతను గట్టిగా నవ్వుతాడు, ఏడుస్తాడు, లేదా కేకలు వేస్తాడు.
    కొన్నిసార్లు సమాజాన్ని లెక్కచేయక పిచ్చివాడిలా పాడుతూ నృత్యం చేస్తాడు.
  mood_brought: జప గమ్యం
  chanting_connection: నామం చివరికి చేసేది ఇదే — ఒక్క రౌండ్‌లో కాదు, ఒక ప్రయాణంగా.
    మీరు వృథాగా జపించడం లేదు. ఈ రౌండ్‌లు నడుస్తూ చేరుకునే ఒక అంతిమ స్థితి ఉంది. ఈరోజు
    ఒక్క అడుగు వేయండి.
- id: 19
  reviewed: false
  translation: 'నా ప్రియమైన రాజా, కలియుగం దోషాల సముద్రమైనప్పటికీ, ఈ యుగానికి ఒక మంచి
    గుణం మాత్రం ఉంది: కేవలం హరే కృష్ణ మహా-మంత్రాన్ని జపించడం ద్వారా మనిషి భౌతిక బంధం
    నుండి విముక్తుడై దివ్య రాజ్యానికి చేరుకోగలడు.'
  mood_brought: కలి యొక్క లొసుగు
  chanting_connection: ఈ యుగం చాలా సాధనలను అసాధ్యమైనంత కష్టతరం చేస్తుంది. కానీ ఒక్క
    సాధన మాత్రం ఎన్నడూ లేనంత సులభం చేయబడింది. లొసుగు అత్యంత విశాలంగా ఉన్న సరిగ్గా
    ఆ కూడలి వద్దనే మీరు కూర్చున్నారు. దాన్ని అందుకోండి.
- id: 20
  reviewed: false
  translation: 'మరణ సమయంలో నన్ను మాత్రమే స్మరిస్తూ తన శరీరాన్ని విడిచిపెట్టేవాడు వెంటనే
    నా స్వభావాన్ని పొందుతాడు. ఇందులో ఎటువంటి సందేహమూ లేదు.

    '
  mood_brought: అంతిమ క్షణానికి సన్నాహం
  chanting_connection: 'జపంలోని ప్రతి రౌండ్ అంతిమ క్షణానికి ఒక సన్నాహం. ఇప్పుడు మీరు
    మనస్సును దేనిలో లగ్నం కావాలని శిక్షణ ఇస్తారో, అప్పుడు అది అందులోనే లగ్నమవుతుంది.
    నేటి రౌండ్‌లే అంతిమ క్షణాన్ని తీర్చిదిద్దుతాయి.

    '
- id: 21
  reviewed: false
  translation: 'కావున, అర్జునా, నీవు సదా నన్ను కృష్ణ రూపంలో స్మరిస్తూనే, అదే సమయంలో
    యుద్ధం చేయవలసిన నీ నిర్దేశిత కర్తవ్యాన్ని నిర్వర్తించు. నీ కార్యకలాపాలను నాకు
    అర్పించి, నీ మనస్సును, బుద్ధిని నాపై నిలిపితే, నిస్సందేహంగా నీవు నన్ను పొందుతావు.

    '
  mood_brought: కర్తవ్యంతో సమన్వయంగా జపం
  chanting_connection: 'కృష్ణుని ఉపదేశం "యుద్ధం ఆపి కేవలం నన్నే స్మరించు" అని కాదు.
    అది రెండూ — కర్తవ్యం మరియు స్మరణ. ఈ రెండింటినీ చేయడంలోని అభ్యాసమే జపం. నేటి రౌండ్‌లు
    నేటి కార్యాలకు శిక్షణ.

    '
- id: 22
  reviewed: false
  translation: 'సదా నా మహిమలను కీర్తిస్తూ, గొప్ప దృఢసంకల్పంతో ప్రయత్నిస్తూ, నాకు ప్రణమిల్లుతూ,
    ఈ మహాత్ములు భక్తితో నన్ను నిత్యమూ ఆరాధిస్తారు.

    '
  mood_brought: మహాత్ముల అభ్యాసం
  chanting_connection: 'మహాత్ముల మూడు కార్యాలు: నిరంతర కీర్తనం, దృఢ ప్రయత్నం, భక్తితో
    కూడిన ప్రణామం. మీరు మొదటిది చేయబోతున్నారు. గుర్తించండి: జపమాలను చేతిలోకి తీసుకున్న
    క్షణంలోనే మీరు మహాత్ముల సాంగత్యంలో ఉంటారు.

    '
- id: 23
  reviewed: false
  translation: 'ఎవరైనా నాకు ప్రేమతో, భక్తితో ఒక ఆకును, పుష్పాన్ని, ఫలాన్ని, లేదా నీటిని
    సమర్పిస్తే, నేను దానిని స్వీకరిస్తాను.

    '
  mood_brought: అర్పణల పట్ల కృష్ణుని తక్కువ ప్రమాణం
  chanting_connection: 'కృష్ణుడు ప్రేమతో అర్పించిన ఒక ఆకును స్వీకరిస్తాడు. మీ అసంపూర్ణమైన
    జపాన్ని కూడా ఆయన ప్రేమతోనే స్వీకరిస్తాడు. అర్పణ గొప్పదయ్యే వరకు దాన్ని వాయిదా
    వేయకండి. ఈ రోజు చేసిన రౌండ్‌లను, అవి ఎలా ఉన్నా సరే, అర్పించండి.

    '
- id: 24
  reviewed: false
  translation: 'ఎవరైనా అత్యంత నీచమైన పనిని చేసినప్పటికీ, అతడు భక్తియుక్త సేవలో నిమగ్నమై
    ఉంటే అతడిని సాధువుగా పరిగణించాలి, ఎందుకంటే అతడు తన నిశ్చయంలో సరిగ్గా స్థిరపడి
    ఉన్నాడు.

    '
  mood_brought: కృష్ణుని అంచనా కరుణ
  chanting_connection: 'కృష్ణుడు మీ యోగ్యతను మీ అత్యంత చెడ్డ పని ద్వారా అంచనా వేయడు.
    ఆయన మీ దిశ ద్వారా అంచనా వేస్తాడు. ఈ రోజు చేసే జపమే ఆ దిశ. మీ లోపాలను మళ్ళీ మళ్ళీ
    తలచుకోకుండా ప్రారంభించండి.

    '
- id: 25
  reviewed: false
  translation: 'నా పరిశుద్ధ భక్తుల తలంపులు నాలోనే నిలిచి ఉంటాయి, వారి జీవితాలు నాకు
    సమర్పించబడ్డాయి, మరియు వారు ఒకరినొకరు జ్ఞానోదయం చేసుకుంటూ, నా గురించి సంభాషించుకుంటూ
    గొప్ప తృప్తిని, ఆనందాన్ని పొందుతారు.

    '
  mood_brought: భక్తుల అంతరంగ స్థితి
  chanting_connection: 'మీరు ఆకాంక్షించే స్థితి ఇక్కడ కృష్ణుడు వర్ణించే స్థితియే:
    మనస్సు ఆయనలో, జీవితం ఆయనకు సమర్పించబడి, సంభాషణ ఆయన గురించి. ఈ రోజు చేసే జప ఈ స్థితి
    సేవలో ఒక చర్య.

    '
- id: 26
  reviewed: false
  translation: 'అన్ని రకాల ధర్మాలను విడిచిపెట్టి కేవలం నాకే శరణాగతుడవు కమ్ము. నేను
    నిన్ను అన్ని పాపఫలాల నుండి విముక్తుడిని చేస్తాను. భయపడకు.

    '
  mood_brought: శరణాగతి మరియు నిర్భయత్వం
  chanting_connection: 'Gītā యొక్క శిఖరం: శరణాగతి, మరియు భయపడకు. japa కు ముందు కూర్చుని,
    ఈ శ్లోకాన్ని పని చేయనివ్వు. తప్పు చేస్తానేమో అనే భయం, సరిపోనేమో అనే భయం — వీటిని
    కృష్ణుడు నేరుగా సంబోధిస్తాడు. Mā śucaḥ.'
- id: 27
  reviewed: false
  translation: ఆత్మానందంలో తృప్తి చెందినవారు, సమస్త భౌతిక కోరికల నుండి విముక్తులైనవారు
    సైతం, దివ్యమైన గుణాలు, అద్భుతమైన లీలలు గల Śrī Kṛṣṇa యొక్క ప్రేమపూర్వక సేవ వైపు
    ఆకర్షితులవుతారు. భగవానుడైన Hari ముక్తులైన ఆత్మలను సైతం ఆకర్షించే అటువంటి గుణాలను
    కలిగి ఉన్నాడు.
  mood_brought: సాధన శాశ్వతంగా కొనసాగుతుంది
  chanting_connection: ātmārāma లు సైతం — ఆత్మసాక్షాత్కారాన్ని పూర్తి చేసినవారు —
    జపం కొనసాగిస్తారు. జపం అనేది గమ్యం చేరిన తర్వాత వదిలేసే సాధనం కాదు. అదే గమ్యం.
    ఆ దీర్ఘ దృష్టితో ప్రారంభించు.
- id: 28
  reviewed: false
  translation: నా ప్రియమైన సేవకులారా, ఎవరి నాలుకలు Kṛṣṇa యొక్క పవిత్ర నామాన్ని, గుణాలను
    కీర్తించవో, ఎవరి హృదయాలు ఒక్కసారైనా Kṛṣṇa యొక్క పాదపద్మాలను స్మరించవో, ఎవరి శిరస్సులు
    ఒక్కసారైనా Kṛṣṇa కు నమస్కరించవో — అటువంటి పాపాత్ములను మాత్రమే నా వద్దకు తీసుకురండి.
  mood_brought: ఏది లెక్కకు వస్తుంది, ఏది రాదు
  chanting_connection: 'Yamarāja యొక్క ప్రమాణం అత్యంత సరళమైనది: నాలుక కీర్తించిందా,
    హృదయం స్మరించిందా, శిరస్సు వంగిందా — ఒక్కసారైనా? నేటి జపమాలలు ఈ మూడింటినీ సంతృప్తిపరుస్తాయి.
    నీవు అతని అధికార పరిధి నుండి బయటపడతావు.'
- id: 29
  reviewed: false
  translation: ఓ Govinda! నీ వియోగాన్ని అనుభవిస్తూ, ఒక క్షణం పన్నెండు సంవత్సరాలు లేదా
    అంతకంటే ఎక్కువగా నాకు అనిపిస్తోంది. వర్షధారల వలె నా కన్నుల నుండి కన్నీళ్లు ప్రవహిస్తున్నాయి,
    నీ లేమిలో ఈ ప్రపంచమంతా శూన్యంగా నాకు అనిపిస్తోంది.
  mood_brought: తపనయే లక్ష్యం
  chanting_connection: అత్యున్నతమైన భక్తి భావం తృప్తి కాదు, వియోగ-తపన. ప్రశాంతమైన
    japa ను కోరుకోకు. "Govinda" అనే ఒక్క నిజాయితీ గల పిలుపు ఒక వేదనను మిగిల్చితే,
    ఆ వేదనయే పురోగతి.
- id: 30
  reviewed: false
  translation: 'నా ప్రభువుగా కృష్ణుని తప్ప మరెవరినీ నేను ఎరుగను; ఆయన తన ఆలింగనంతో
    నన్ను కఠినంగా నలిపివేసినా, లేదా నా ముందు ప్రత్యక్షం కాక నా హృదయాన్ని విరిచినా,
    ఆయనే నా ప్రభువుగా నిలిచి ఉంటారు. ఆయన ఏదైనా, అన్నీ చేయడానికి సంపూర్ణ స్వతంత్రులు;
    ఎందుకంటే ఆయన ఎల్లప్పుడూ, ఏ షరతులూ లేకుండా, నా ఆరాధ్య ప్రభువు.

    '
  mood_brought: షరతులు లేని స్వీకారం
  chanting_connection: 'శిక్షాష్టకం యొక్క శిఖరాగ్రం: ఆయన ఆలింగనం చేయవచ్చు, తన అనుపస్థితితో
    హృదయాన్ని విరవవచ్చు, ఏదైనా చేయవచ్చు — అయినా ఆయనే ప్రభువు. ఏమీ అడగకుండా, ఈ షరతులు
    లేని భావంతో జపాన్ని ప్రారంభించండి.

    '
