prejapa.apply: దీనితో కాసేపు కూర్చోండి — జపానికి ముందు ఒకసారి
prejapa.corpus_offline: కార్పస్ ఆఫ్‌లైన్ — నేటి బోధన ఎంపిక చేసిన గ్రంథాలయం నుండి.
prejapa.deepen_default: హరి-నామంపై ఒక బోధన
prejapa.enter: జపంలోకి ప్రవేశించండి
prejapa.enter_body: 'ఇప్పుడు మీ జపంలోకి ప్రవేశించండి — ప్రతి నామాన్ని వినడానికి జపించండి,
  ఆశ్రయం పొందుతూ, గడ్డిపోచ కంటే వినయంగా. నేటి దృష్టిని లోనికి తీసుకెళ్లండి: {orient}'
prejapa.footer: సిద్ధమైనప్పుడు ఈ విండోను మూసివేయండి. జప సమయంలో తెర నిశ్శబ్దంగా ఉంటుంది.
prejapa.machine_banner: ఇక్కడి తెలుగు యంత్ర-అనువాదం — భక్తుల సమీక్ష కోసం వేచి ఉంది.
