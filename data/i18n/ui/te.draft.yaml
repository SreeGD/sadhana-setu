nama_tattva.heading: Nāma-Tattva — నామం గురించి ఒక బోధన
notes.caption: సేకరించిన పవిత్ర నామ ప్రవచనాల నుండి సమీక్షించిన తరగతి గమనికలు.
notes.empty: ఇంకా సమీక్షించిన గమనికలు లేవు. ఒక భక్తుడు ఆమోదించిన తర్వాత సుసంపన్నమైన
  గమనికలు ఇక్కడ కనిపిస్తాయి.
notes.heading: Hari-Nāma గమనికలు
notes.open: ఒక గమనికను తెరవండి
prejapa.corpus_offline: కార్పస్ ఆఫ్‌లైన్ — నేటి బోధన ఎంపిక చేసిన గ్రంథాలయం నుండి.
prejapa.footer: సిద్ధమైనప్పుడు ఈ విండోను మూసివేయండి. జపం సమయంలో తెర నిశ్శబ్దంగా ఉంటుంది.
