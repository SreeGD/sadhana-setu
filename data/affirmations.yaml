affirmations:
  - text: "I am the eternal servant of Krishna."
    source: "CC Madhya 20.108 — jīvera svarūpa haya nityera kṛṣṇa-dāsa"
    category: sambandha

  - text: "Today I take shelter of the Holy Name alone."
    source: "CC Adi 17.21 — harer nāma harer nāma harer nāmaiva kevalam"
    category: sharanagati

  - text: "The Name and Krishna are non-different — chanting is meeting Him."
    source: "CC Madhya 17.133, Prabhupada's purport"
    category: nama-tattva

  - text: "I have no other shelter but You."
    source: "BG 9.22 (ananyāś cintayanto mām)"
    category: sharanagati

  - text: "By chanting, the mirror of my heart is cleansed."
    source: "Siksastakam 1 — ceto-darpana-marjanam"
    category: abhidheya

  - text: "I surrender all dharmas; I take refuge in You alone."
    source: "BG 18.66 — sarva-dharmān parityajya"
    category: sharanagati

  - text: "I am not the doer. The Name acts; I am present."
    source: "BG 5.8, Prabhupada's purport"
    category: nirahankara

  - text: "Your mercy alone is the essence; nothing else compares."
    source: "Bhaktivinoda Thakur, Saranagati"
    category: krpa

  - text: "Let me chant in the mood humbler than a blade of grass."
    source: "Siksastakam 3 — tṛṇād api sunīcena"
    category: humility

  - text: "Today I serve the Name with my tongue, ear, and mind."
    source: "Nectar of Instruction 8 — tan-nāma-rūpa-caritādi"
    category: seva

  - text: "Sri Caitanya Mahaprabhu, Lord Nityananda — at Your feet I take refuge."
    source: "Pancha-tattva mantra"
    category: sharanagati

  - text: "Without the Name, life is dust; with it, life is nectar."
    source: "Saranagati by Bhaktivinoda Thakura"
    category: rasa

  - text: "The Holy Name is my only wealth."
    source: "Siksastakam 4 — na dhanaṁ na janaṁ na sundarīṁ kavitāṁ"
    category: prayojana

  - text: "I belong to those who think of no other; You preserve what they have."
    source: "BG 9.22, Prabhupada's purport"
    category: sharanagati

  - text: "Today's vow: sixteen rounds, offered through hearing."
    source: "Hari-bhakti-vilasa; ISKCON regulative principle"
    category: pratijna

  - text: "I am dust at the feet of Vaishnavas; let me serve them too."
    source: "Sri Vaishnava Pranama mantra"
    category: vaishnava-seva

  - text: "May the Name dance on my tongue all day."
    source: "Siksastakam 6 — nayanaṁ galad-aśru-dhārayā"
    category: rasa

  - text: "Let me remember You at every moment, especially the last."
    source: "BG 8.5 — anta-kāle ca mām eva smaran"
    category: smarana

  - text: "All I possess is Yours; this chanting is my best offering."
    source: "BG 9.27 — yat karoṣi yad aśnāsi"
    category: arpana

  - text: "Krishna is the proprietor; I am only His servant."
    source: "BG 5.29, Prabhupada's purport — bhoktāraṁ yajña-tapasāṁ"
    category: sambandha

  - text: "In this fallen age, chanting alone is the way."
    source: "SB 12.3.51 — kīrtanād eva kṛṣṇasya"
    category: yuga-dharma

  - text: "The Holy Name accepts me even when I am unworthy."
    source: "Bhaktivinoda Thakur, Hari-nama-cintamani 1"
    category: krpa

  - text: "I bow to my guru, through whom the Name has reached me."
    source: "BG 4.34 — tad viddhi praṇipātena"
    category: guru-bhakti

  - text: "I aspire to chant suddha-nama, free from offense."
    source: "Hari-nama-cintamani 2 — the three stages"
    category: nama-tattva

  - text: "Let my heart soften today; let the Name penetrate."
    source: "Siksastakam 6 — nayanam galad-asru"
    category: bhava
