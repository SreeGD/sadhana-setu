<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1800" viewBox="0 0 1200 1800" role="img" aria-label="Front cover — Nāma-Tattva">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b2144"/>
      <stop offset="0.55" stop-color="#081733"/>
      <stop offset="1" stop-color="#03080f"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fbe9b0"/>
      <stop offset="0.45" stop-color="#e8c874"/>
      <stop offset="1" stop-color="#d4af37"/>
    </radialGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#e8c874" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#e8c874" stop-opacity="0"/>
    </radialGradient>
    <style>
      .deva  { font-family: "Noto Serif Devanagari","Nirmala UI","Kohinoor Devanagari",serif; }
      .serif { font-family: Georgia,"Times New Roman",serif; }
      .title { fill:#eccf7e; }
      .cream { fill:#f4ecd8; }
      .muted { fill:#9db4d0; }
    </style>
  </defs>

  <rect width="1200" height="1800" fill="url(#bg)"/>
  <!-- inner gold frame -->
  <rect x="46" y="46" width="1108" height="1708" fill="none" stroke="#d4af37" stroke-opacity="0.55" stroke-width="2"/>
  <rect x="60" y="60" width="1080" height="1680" fill="none" stroke="#d4af37" stroke-opacity="0.25" stroke-width="1"/>

  <!-- Devanagari title -->
  <text x="600" y="215" text-anchor="middle" class="deva title" font-size="86" letter-spacing="4">नाम-तत्त्व</text>
  <line x1="430" y1="258" x2="770" y2="258" stroke="#d4af37" stroke-opacity="0.6" stroke-width="1.5"/>

  <!-- Sun behind clouds emblem -->
  <g transform="translate(600,560)">
    <circle r="270" fill="url(#halo)"/>
    <g stroke="#e8c874" stroke-opacity="0.65" stroke-width="3" stroke-linecap="round">
      <line x1="0" y1="-235" x2="0" y2="-198"/>
      <line x1="117" y1="-203" x2="99" y2="-171" transform="rotate(0)"/>
      <line x1="0" y1="-235" x2="0" y2="-198" transform="rotate(30)"/>
      <line x1="0" y1="-235" x2="0" y2="-198" transform="rotate(60)"/>
      <line x1="0" y1="-235" x2="0" y2="-198" transform="rotate(90)"/>
      <line x1="0" y1="-235" x2="0" y2="-198" transform="rotate(120)"/>
      <line x1="0" y1="-235" x2="0" y2="-198" transform="rotate(150)"/>
      <line x1="0" y1="-235" x2="0" y2="-198" transform="rotate(180)"/>
      <line x1="0" y1="-235" x2="0" y2="-198" transform="rotate(210)"/>
      <line x1="0" y1="-235" x2="0" y2="-198" transform="rotate(240)"/>
      <line x1="0" y1="-235" x2="0" y2="-198" transform="rotate(270)"/>
      <line x1="0" y1="-235" x2="0" y2="-198" transform="rotate(300)"/>
      <line x1="0" y1="-235" x2="0" y2="-198" transform="rotate(330)"/>
      <line x1="0" y1="-235" x2="0" y2="-198" transform="rotate(15)"/>
      <line x1="0" y1="-235" x2="0" y2="-198" transform="rotate(45)"/>
      <line x1="0" y1="-235" x2="0" y2="-198" transform="rotate(75)"/>
      <line x1="0" y1="-235" x2="0" y2="-198" transform="rotate(105)"/>
      <line x1="0" y1="-235" x2="0" y2="-198" transform="rotate(135)"/>
      <line x1="0" y1="-235" x2="0" y2="-198" transform="rotate(165)"/>
      <line x1="0" y1="-235" x2="0" y2="-198" transform="rotate(195)"/>
      <line x1="0" y1="-235" x2="0" y2="-198" transform="rotate(225)"/>
      <line x1="0" y1="-235" x2="0" y2="-198" transform="rotate(255)"/>
      <line x1="0" y1="-235" x2="0" y2="-198" transform="rotate(285)"/>
      <line x1="0" y1="-235" x2="0" y2="-198" transform="rotate(315)"/>
      <line x1="0" y1="-235" x2="0" y2="-198" transform="rotate(345)"/>
    </g>
    <circle r="150" fill="url(#sun)"/>
    <!-- clouds crossing the lower sun -->
    <g fill="#7f95b6" fill-opacity="0.9">
      <path d="M -300 78 q 40 -46 96 -30 q 26 -46 92 -30 q 42 -34 96 -6 q 60 -14 88 26 q 50 4 40 40 l -560 0 q -8 -34 40 -30 z"/>
    </g>
    <g fill="#a8bcd8" fill-opacity="0.92">
      <path d="M -250 132 q 44 -50 104 -30 q 34 -40 96 -22 q 48 -30 104 2 q 66 -8 92 34 q 44 8 30 44 l -560 0 q -6 -40 30 -40 z"/>
    </g>
  </g>

  <!-- Title -->
  <text x="600" y="960" text-anchor="middle" class="serif title" font-size="120" letter-spacing="6" font-weight="bold">NĀMA-TATTVA</text>

  <!-- Subtitle -->
  <text x="600" y="1050" text-anchor="middle" class="serif cream" font-size="43" font-style="italic">Why My Chanting Isn't Working</text>
  <text x="600" y="1108" text-anchor="middle" class="serif cream" font-size="43" font-style="italic">(and How to Fix It)</text>

  <!-- divider -->
  <g transform="translate(600,1180)">
    <line x1="-210" y1="0" x2="-30" y2="0" stroke="#d4af37" stroke-opacity="0.7"/>
    <line x1="30" y1="0" x2="210" y2="0" stroke="#d4af37" stroke-opacity="0.7"/>
    <circle cx="0" cy="0" r="6" fill="none" stroke="#d4af37" stroke-opacity="0.8"/>
    <circle cx="0" cy="0" r="2.4" fill="#d4af37"/>
  </g>

  <text x="600" y="1252" text-anchor="middle" class="serif muted" font-size="38" letter-spacing="4">A Diagnostic Guide to the Holy Name</text>

  <!-- maha-mantra -->
  <text x="600" y="1560" text-anchor="middle" class="serif title" font-size="27" letter-spacing="3">HARE KṚṢṆA · HARE RĀMA</text>

  <!-- author -->
  <line x1="470" y1="1636" x2="730" y2="1636" stroke="#d4af37" stroke-opacity="0.4"/>
  <text x="600" y="1690" text-anchor="middle" class="serif cream" font-size="34" letter-spacing="2">Sreenivas Gopal Dāsa</text>
</svg>
