# Hari-Nāma Corpus — Source Manifest (STUB / scaffolding)
#
# Single source of truth for which lectures belong to the corpus. The pipeline
# (specs/001-corpus-pipeline) reads and updates this file. Audio is fetched to a
# git-ignored cache; only this manifest + the resulting text are committed.
#
# This is a SCHEMA STUB with empty source sets. The exact field set is finalized in
# specs/001-corpus-pipeline/data-model.md (Phase 1).
#
# Scope (resolved, Clarify 2026-06-24): Round 1 = all Holy Name seminars in full + speaker
# lectures whose title/tag is a Holy-Name topic; non-English entries are recorded with
# status `deferred`; entries are seeded once via assisted listing, then maintained manually.
#
# Entry shape (illustrative — not yet populated):
#   lectures:
#     - id: bhurijana-attentive-chanting-2018-01-12   # stable slug, also the transcript filename
#       title: "Attentive Chanting of the Holy Name"
#       urls:                                          # one or more source URLs (alternates allowed)
#         - "https://audio.iskcondesiretree.com/...mp3"
#       date: 2018-01-12                               # if known
#       status: pending                                # pending | fetched | transcribed | unavailable | excluded
#       sha256: null                                   # filled on fetch
#       duration_seconds: null                         # filled on fetch/transcribe
#       language: en                                   # source-audio language
#       notes: ""                                      # maintainer notes / exclusion reason

