<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#FFFBF3">
  <title>Sadhana Setu</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
</head>
<body>
  <header class="topbar">
    <span class="symbol">❦</span>
    <span class="title">Sadhana Setu</span>
    <span class="devanagari">साधना सेतुः</span>
    <span class="tagline" data-i18n="app.tagline">· a bridge between aspiration and act</span>
    <span class="lang-controls">
      <label for="lang-select" class="visually-hidden" data-i18n="sidebar.language">Language</label>
      <select id="lang-select" aria-label="Language">
        <option value="en">English</option>
        <option value="te">తెలుగు</option>
        <option value="kn">ಕನ್ನಡ</option>
        <option value="ta">தமிழ்</option>
      </select>
    </span>
    <span class="font-controls" aria-label="Text size">
      <button id="font-smaller" title="Smaller text">A−</button>
      <button id="font-reset" title="Default text size">A</button>
      <button id="font-bigger" title="Larger text">A+</button>
    </span>
  </header>

  <nav class="tabs">
    <button data-view="prejapa" class="active" data-i18n="view.pre_japa">Pre-japa</button>
    <button data-view="today" data-i18n="view.today">Today</button>
    <button data-view="this_week" data-i18n="view.this_week">This Week</button>
    <button data-view="saturday" data-i18n="view.saturday">Saturday</button>
    <button data-view="backup" class="tab-secondary" data-i18n="nav.backup">Backup</button>
  </nav>

  <main id="root"></main>

  <footer class="footer">
    <span data-i18n="footer.local_first">Local-first. No accounts. Your data stays on this device.</span>
    <span class="footer-sep">·</span>
    <span id="storage-summary">…</span>
  </footer>

  <script type="module" src="js/app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js').catch(err => console.warn('SW registration failed:', err));
      });
    }
  </script>
</body>
</html>
